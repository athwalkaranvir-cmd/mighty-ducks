    const today=gd.date||new Date().toISOString().slice(0,10);
    const eligibleToday=updated.filter(g=>g.date===today&&g.plays&&g.awardEligible!==false).length;
    if(awardEligible!==false&&eligibleToday>=2){setAwardDate(today);setScr("awards")}else{setScr("setup")}
    setPlays([]);setInn(1);setOuts(0);setBatIdx(0);setHist([]);clearActive();
    setBases({first:null,second:null,third:null});setLastO(null);setGd(null);setOurS({});setOppS({});setWaitOpp(false)};

  const startG=d=>{setGd(d);setScr("scoring");setPlays([]);setInn(1);setOuts(0);setBatIdx(0);setHist([]);setLastO(null);setBases({first:null,second:null,third:null});setOurS({});setOppS({});setWaitOpp(false)};
  const addP=n=>{if(n&&!roster.includes(n)){setRoster(p=>[...p,n]);setLineup(p=>[...p,n])}};
  const addLatePlayer=n=>{if(n&&gd){const newLu=[...gd.lineup,n];setGd({...gd,lineup:newLu});if(!roster.includes(n))setRoster(p=>[...p,n])}};

  if(scr==="stats")return<StatsPage games={games} onBack={()=>setScr("setup")}/>;
  if(scr==="history")return<HistoryPage games={games} onBack={()=>setScr("setup")} onView={g=>{setViewG(g);setScr("detail")}} onDelete={id=>setGames(p=>p.filter(g=>(g.id||0)!==id))} locked={locked}/>;
  if(scr==="detail"&&viewG)return<GameDetail game={viewG} onBack={()=>setScr("history")} locked={locked} onEdit={()=>{setEditG(viewG);setScr("editgame")}}/>;
  if(scr==="editgame"&&editG)return<GameEditor game={editG} roster={roster} onCancel={()=>setScr("detail")} onSave={ug=>{setGames(ps=>ps.map(g=>(g.id||0)===(ug.id||0)?ug:g));setViewG(ug);setEditG(null);setScr("detail")}}/>;
  if(scr==="sync")return<SyncPage games={games} onBack={()=>setScr("setup")} onSynced={ids=>setGames(p=>p.map(g=>ids.includes(g.id)?{...g,synced:true}:g))} sheetLink={sheetLink} setSheetLink={setSheetLink}/>;
  if(scr==="awards"&&awardDate)return<DailyAwards games={games} date={awardDate} onDone={()=>{setAwardDate(null);setScr("setup")}}/>;
  if(scr==="summary")return<Summary gd={gd} plays={plays} ourS={ourS} oppS={oppS} onSave={saveG} canUpload={!!ldT("sync_url","")}/>;

  if(scr==="scoring"&&gd){
    const BtnStyle=(c)=>({padding:"10px 6px",borderRadius:10,border:"none",cursor:"pointer",background:OC[c],color:"#fff",fontWeight:700,fontSize:11,fontFamily:FM,minWidth:0});
    return(
    <div style={{maxWidth:480,margin:"0 auto",padding:"12px 16px 100px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
        <div><div style={{fontSize:11,color:"#5e6e82",fontWeight:600}}>{TEAM} ({gd.isHome?"HOME":"AWAY"})</div>
          <div style={{fontSize:13,fontWeight:700,color:"#1B5E20"}}>vs {gd.opponent||"TBD"}</div></div>
        <button onClick={()=>setScr("summary")} style={{padding:"6px 14px",borderRadius:8,border:"2px solid #F44336",background:"transparent",color:"#F44336",fontSize:11,fontWeight:700,cursor:"pointer"}}>END GAME</button></div>
      <div style={{fontSize:11,color:"#5e6e82",marginBottom:6}}>{gd.date}{gd.field?` • ${gd.field}`:""}{gd.gameNum?` • Game ${gd.gameNum}`:""}</div>
      <div style={{display:"flex",alignItems:"center",gap:16,justifyContent:"center",padding:"8px 0"}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11,color:"#5e6e82",fontWeight:600}}>INN</span>
          <span style={{fontSize:28,fontWeight:800,color:"#1B5E20",fontFamily:FM}}>{inn}</span></div>
        <div style={{width:1,height:30,background:"#7e93b2",opacity:.4}}/>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <span style={{fontSize:11,color:"#5e6e82",fontWeight:600}}>OUTS</span>
          <div style={{display:"flex",gap:4}}>{[0,1,2].map(i=><div key={i} style={{width:16,height:16,borderRadius:"50%",
            background:i<outs?"#F44336":"transparent",border:`2px solid ${i<outs?"#F44336":"#7e93b2"}`,boxShadow:i<outs?"0 0 8px #F44336":"none"}}/>)}</div></div></div>
      <Diamond bases={bases} last={lastO} ab={curBat}/>
      <div style={{textAlign:"center",margin:"10px 0 6px"}}>
        <div style={{fontSize:11,color:"#5e6e82",fontWeight:600}}>NOW BATTING</div>
        <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
          <span style={{fontSize:22,fontWeight:900,color:"#1B5E20",fontFamily:FM}}>{curBat}</span>
          <button onClick={()=>setPicking(!picking)} style={{padding:"4px 8px",borderRadius:6,border:"1px solid #7e93b2",background:"transparent",color:"#5e6e82",fontSize:10,fontWeight:600,cursor:"pointer"}}>SWITCH</button>
          <button onClick={()=>setSkipConf(curBat)} style={{padding:"4px 8px",borderRadius:6,border:"1px solid #F44336",background:"transparent",color:"#F44336",fontSize:10,fontWeight:600,cursor:"pointer"}}>SKIP</button></div>
        <div style={{fontSize:11,color:"#5e6e82"}}>#{(batIdx%gd.lineup.length)+1} of {gd.lineup.length}
          <span onClick={()=>setAddLate(true)} style={{marginLeft:8,color:"#1B5E20",fontWeight:700,cursor:"pointer",textDecoration:"underline"}}>Edit Lineup</span></div></div>

      {picking&&<div style={{background:"#fff",borderRadius:12,border:"1px solid #cdd9e6",padding:8,marginBottom:8,boxShadow:"0 4px 16px rgba(0,0,0,.1)"}}>
        {gd.lineup.map(n=><button key={n} onClick={()=>{const idx=gd.lineup.indexOf(n);if(idx>=0)setBatIdx(idx+Math.floor(batIdx/gd.lineup.length)*gd.lineup.length);setPicking(false)}}
          style={{display:"block",width:"100%",padding:"8px 12px",textAlign:"left",border:"none",background:n===curBat?"#e8f5e9":"transparent",borderRadius:6,cursor:"pointer",fontSize:13,fontWeight:600,color:"#1B5E20"}}>{n}</button>)}</div>}

      {/* Outcome buttons with full names */}
      <div style={{background:"#f2f6fb",borderRadius:14,padding:14,marginTop:6,border:"1px solid #cdd9e6"}}>
        <div style={{fontSize:11,color:"#5e6e82",fontWeight:600,marginBottom:6}}>HITS</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:10}}>
          {HITS.map(c=><button key={c} onClick={()=>setModal({batter:curBat,outcome:c})} style={BtnStyle(c)}>{OL[c]}</button>)}</div>
        <div style={{fontSize:11,color:"#5e6e82",fontWeight:600,marginBottom:6}}>OUTS</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:6,marginBottom:10}}>
          {OUTS.map(c=><button key={c} onClick={()=>setModal({batter:curBat,outcome:c})} style={BtnStyle(c)}>{OL[c]}</button>)}</div>
        <div style={{fontSize:11,color:"#5e6e82",fontWeight:600,marginBottom:6}}>OTHER</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
          {OTHER.map(c=><button key={c} onClick={()=>setModal({batter:curBat,outcome:c})} style={BtnStyle(c)}>{OL[c]}</button>)}</div>
      </div>

      <Scoreboard opp={gd.opponent} ourS={ourS} oppS={oppS} isHome={gd.isHome}/>

      <div style={{marginTop:14}}>
        <button onClick={()=>setShowPbP(!showPbP)} style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 14px",borderRadius:10,border:"1px solid #cdd9e6",background:"#fff",cursor:"pointer",fontFamily:FM}}>
          <span style={{fontSize:12,fontWeight:800,color:"#1B5E20",letterSpacing:1}}>PLAY-BY-PLAY</span>
          <span style={{fontSize:11,color:"#5e6e82",fontWeight:700}}>{showPbP?"HIDE ▲":"SHOW ▼"}</span></button>
        {showPbP&&<div style={{marginTop:10}}><PlayByPlay plays={plays} ourS={ourS} oppS={oppS} reverse={true}/></div>}
      </div>

      {!waitOpp&&oppAsk===null&&<div style={{textAlign:"center",marginTop:14}}>
        <button onClick={()=>{if(endConfirm){endInning()}else{setEndConfirm(true);setTimeout(()=>setEndConfirm(false),3000)}}}
          style={{padding:"12px 22px",borderRadius:10,border:"2px solid #FF9800",cursor:"pointer",fontFamily:FM,fontWeight:800,fontSize:13,
            background:endConfirm?"#FF9800":"transparent",color:endConfirm?"#fff":"#E65100"}}>
          {endConfirm?"TAP AGAIN TO END INNING":"⛔ END OUR INNING"}</button>
        {endConfirm&&<div style={{fontSize:10,color:"#5e6e82",marginTop:5}}>Ends our at-bats now (6-run rule, etc.)</div>}
      </div>}

      {waitOpp&&<div style={{background:"#FFF3E0",borderRadius:12,padding:16,marginTop:12,border:"2px solid #FF9800",textAlign:"center"}}>
        <div style={{fontSize:13,fontWeight:700,color:"#E65100",marginBottom:8}}>Waiting for {gd.opponent||"opponent"} to bat...</div>
        <button onClick={()=>setOppAsk(inn)} style={{padding:"12px 24px",borderRadius:10,border:"none",background:"#FF9800",color:"#fff",fontWeight:800,fontSize:14,cursor:"pointer"}}>THEIR INNING IS OVER</button>
      </div>}

      {hist.length>0&&<div style={{textAlign:"center",marginTop:12}}>
        <button onClick={undo} style={{padding:"6px 16px",borderRadius:8,border:"1px solid #F44336",background:"transparent",color:"#F44336",fontSize:11,fontWeight:700,cursor:"pointer"}}>UNDO LAST</button></div>}

      {modal&&<OutModal batter={modal.batter} outcome={modal.outcome} bases={bases} onOk={doPlay} onNo={()=>setModal(null)}/>}
      {oppAsk!==null&&<OppModal inning={oppAsk} onOk={doOpp}/>}

      {skipConf&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
        <div style={{background:"#f2f6fb",borderRadius:16,padding:24,maxWidth:340,width:"100%",textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
          <div style={{fontSize:16,fontWeight:700,color:"#1B5E20",marginBottom:8}}>Remove {skipConf}?</div>
          <div style={{fontSize:12,color:"#5e6e82",marginBottom:16}}>They'll be removed from the lineup for the rest of this game.</div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setSkipConf(null)} style={{flex:1,padding:12,borderRadius:10,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:700,cursor:"pointer"}}>Cancel</button>
            <button onClick={()=>{const newLu=gd.lineup.filter(n=>n!==skipConf);if(!newLu.length){setSkipConf(null);return}
              const nb={...bases};if(nb.first===skipConf)nb.first=null;if(nb.second===skipConf)nb.second=null;if(nb.third===skipConf)nb.third=null;
              setBases(nb);setGd({...gd,lineup:newLu});if(batIdx>=newLu.length)setBatIdx(batIdx%newLu.length);setSkipConf(null)}}
              style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#F44336",color:"#fff",fontWeight:700,cursor:"pointer"}}>Remove</button></div></div></div>}

      {/* Mid-game lineup manager */}
      {addLate&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"#f2f6fb",borderRadius:16,padding:20,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{fontSize:16,fontWeight:700,color:"#1B5E20",marginBottom:4}}>Edit Lineup</div>
          <div style={{fontSize:11,color:"#5e6e82",marginBottom:12}}>Drag to reorder • × to remove • add from roster or type a new name</div>

          {/* Draggable lineup */}
          {gd.lineup.map((n,i)=>(
            <div key={n} draggable
              onDragStart={()=>setDragI(i)} onDragOver={e=>e.preventDefault()}
              onDrop={()=>{if(dragI!==null&&dragI!==i){const a=[...gd.lineup];const[it]=a.splice(dragI,1);a.splice(i,0,it);setGd({...gd,lineup:a});setDragI(null)}}}
              onDragEnd={()=>setDragI(null)}
              onTouchStart={()=>setDragI(i)}
              style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",
                background:dragI===i?"#C8E6C9":(i%2===0?"#fff":"#eff3f9"),
                borderRadius:8,marginBottom:3,cursor:"grab",border:"1px solid #dce5f0",transition:"background .2s"}}>
              <span style={{fontSize:10,color:"#5e6e82",cursor:"grab",userSelect:"none"}}>☰</span>
              <span style={{fontSize:13,fontWeight:800,color:"#1B5E20",fontFamily:FM,width:22,textAlign:"center"}}>{i+1}</span>
              <span style={{fontSize:13,fontWeight:600,color:"#333",flex:1}}>{n}</span>
              {n===curBat&&<span style={{fontSize:9,color:"#FF9800",fontWeight:700}}>AT BAT</span>}
              <button onClick={()=>{
                const newLu=gd.lineup.filter(x=>x!==n);
                if(!newLu.length)return;
                const nb={...bases};if(nb.first===n)nb.first=null;if(nb.second===n)nb.second=null;if(nb.third===n)nb.third=null;
                setBases(nb);setGd({...gd,lineup:newLu});
                if(batIdx>=newLu.length)setBatIdx(batIdx%newLu.length);
              }} style={{background:"none",border:"none",color:"#F44336",cursor:"pointer",fontSize:16,lineHeight:1,padding:"0 2px"}}>×</button>
            </div>
          ))}

          {/* Roster players not in lineup */}
          {roster.filter(n=>!gd.lineup.includes(n)).length>0&&<div style={{marginTop:12}}>
            <div style={{fontSize:11,color:"#5e6e82",fontWeight:600,marginBottom:6}}>ADD FROM ROSTER</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
              {roster.filter(n=>!gd.lineup.includes(n)).map(n=>
                <button key={n} onClick={()=>{addLatePlayer(n)}} style={{padding:"7px 12px",borderRadius:8,border:"1px solid #7e93b2",background:"transparent",color:"#33414f",fontSize:12,fontWeight:600,cursor:"pointer"}}>{n}</button>)}</div></div>}

          {/* Add brand new player */}
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <input value={lateP} onChange={e=>setLateP(e.target.value)} placeholder="New player name"
              style={{flex:1,padding:"8px 12px",borderRadius:8,border:"1px solid #cdd9e6",fontSize:13,background:"#fff",outline:"none"}}
              onKeyDown={e=>{if(e.key==="Enter"&&lateP.trim()){addLatePlayer(lateP.trim());setLateP("")}}}/>
            <button onClick={()=>{if(lateP.trim()){addLatePlayer(lateP.trim());setLateP("")}}}
              style={{padding:"8px 14px",borderRadius:8,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:700,cursor:"pointer"}}>+</button>
          </div>

          <button onClick={()=>{setAddLate(false);setLateP("");setDragI(null)}} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:800,fontSize:14,cursor:"pointer",marginTop:14}}>DONE</button>
        </div></div>}
    </div>);}

  // ─── SETUP ───
  return(
    <div style={{maxWidth:480,margin:"0 auto",padding:20}}>
      <div style={{position:"relative",borderRadius:18,marginBottom:22,padding:"26px 18px 20px",textAlign:"center",overflow:"hidden",
        background:"radial-gradient(120% 140% at 50% -20%, #123 0%, #0a141f 55%, #060d16 100%)",
        border:"1px solid rgba(0,230,118,.35)",
        boxShadow:"inset 0 0 30px rgba(0,230,118,.10), 0 10px 34px rgba(0,0,0,.5)"}}>
        <div style={{position:"absolute",inset:0,opacity:.5,pointerEvents:"none",
          backgroundImage:"radial-gradient(rgba(255,255,255,.18) 1px, transparent 1.4px)",backgroundSize:"7px 7px"}}/>
        <div style={{position:"absolute",left:16,right:16,bottom:12,height:2,borderRadius:2,
          background:"linear-gradient(90deg,transparent,#00e676,#ffd600,#00e676,transparent)",boxShadow:"0 0 12px rgba(0,230,118,.8)"}}/>
        <div style={{position:"relative"}}>
          <div style={{fontSize:13,letterSpacing:6,color:"#FFD600",fontWeight:700,textShadow:"0 0 10px rgba(255,214,0,.55)"}}>● SLO-PITCH ●</div>
          <div onClick={()=>setTeamMenu(true)} style={{fontFamily:"'Teko',sans-serif",fontWeight:700,fontSize:62,lineHeight:.86,letterSpacing:3,marginTop:6,cursor:"pointer",
            color:"#eafff2",textShadow:"0 0 14px rgba(0,230,118,.85), 0 0 34px rgba(0,230,118,.45)"}}>{TEAM}</div>
          <div style={{display:"flex",gap:6,justifyContent:"center",flexWrap:"wrap",marginTop:4}}>
            <div onClick={()=>setTeamMenu(true)} style={{fontSize:11,letterSpacing:2,color:"#7fe9b4",fontWeight:700,cursor:"pointer",padding:"3px 12px",borderRadius:14,border:"1px solid rgba(0,230,118,.4)",background:"rgba(0,0,0,.25)"}}>▾ SWITCH / ADD TEAM</div>
            <div onClick={()=>setShowLock(true)} style={{fontSize:11,letterSpacing:1,color:locked?"#FFB74D":"#7fe9b4",fontWeight:700,cursor:"pointer",padding:"3px 12px",borderRadius:14,border:`1px solid ${locked?"rgba(255,152,0,.5)":"rgba(0,230,118,.4)"}`,background:"rgba(0,0,0,.25)"}}>{ld("owner_pin","")?(locked?"🔒 LOCKED":"🔓 UNLOCKED"):"🔒 SET EDIT PIN"}</div>
          </div>
          <div style={{fontSize:9,color:"#5b7a92",marginTop:6,letterSpacing:2,fontFamily:FM}}>{APP_VERSION}</div>
          {ldT("sync_url","")&&(()=>{const pend=games.filter(g=>!g.synced).length;
            return(<div style={{display:"inline-flex",alignItems:"center",gap:7,marginTop:12,padding:"5px 14px",borderRadius:20,
              background:"rgba(0,0,0,.35)",border:`1px solid ${pend?"rgba(255,152,0,.5)":"rgba(0,230,118,.5)"}`}}>
              <div style={{width:8,height:8,borderRadius:"50%",background:pend?"#FF9800":"#00e676",boxShadow:`0 0 8px ${pend?"#FF9800":"#00e676"}`}}/>
              <span style={{fontSize:10,fontWeight:700,letterSpacing:.5,color:pend?"#FFB74D":"#7fe9b4"}}>{pend?`${pend} GAME${pend!==1?"S":""} NOT UPLOADED`:"ALL GAMES UPLOADED"}</span></div>);})()}
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,marginBottom:16}}>
        <button onClick={()=>setScr("stats")} style={{padding:10,borderRadius:10,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontWeight:700,fontSize:10,cursor:"pointer"}}>STATS</button>
        <button onClick={()=>setScr("history")} style={{padding:10,borderRadius:10,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontWeight:700,fontSize:10,cursor:"pointer"}}>GAMES</button>
        <button onClick={()=>setScr("sync")} style={{padding:10,borderRadius:10,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontWeight:700,fontSize:10,cursor:"pointer"}}>SYNC</button>
        <button onClick={()=>setShowShare(true)} disabled={!roster.length} style={{padding:10,borderRadius:10,border:"2px solid #FF9800",background:"transparent",color:"#FF9800",fontWeight:700,fontSize:10,cursor:roster.length?"pointer":"default",opacity:roster.length?1:.4}}>SHARE</button>
      </div>
      <div style={{background:"#f2f6fb",borderRadius:16,padding:20,marginBottom:16,border:"1px solid #cdd9e6"}}>
        <div style={{fontSize:12,fontWeight:700,color:"#5e6e82",marginBottom:12}}>GAME INFO</div>
        <div style={{display:"flex",gap:10,marginBottom:10}}>
          <div style={{flex:2}}><label style={{fontSize:10,fontWeight:700,color:"#1B5E20",marginBottom:4,display:"block"}}>DATE</label>
            <input type="date" value={gDate} onChange={e=>setGDate(e.target.value)} style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #cdd9e6",fontSize:14,fontFamily:FM,background:"#fff",outline:"none",boxSizing:"border-box"}}/></div>
          <div style={{flex:1}}><label style={{fontSize:10,fontWeight:700,color:"#1B5E20",marginBottom:4,display:"block"}}>GAME #</label>
            <input value={gNum} onChange={e=>setGNum(e.target.value)} placeholder="#" style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #cdd9e6",fontSize:14,fontFamily:FM,background:"#fff",outline:"none",textAlign:"center",boxSizing:"border-box"}}/></div></div>
        <div style={{marginBottom:10}}><label style={{fontSize:10,fontWeight:700,color:"#1B5E20",marginBottom:4,display:"block"}}>OPPONENT</label>
          <input value={opp} onChange={e=>setOpp(e.target.value)} placeholder="Team name" style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"2px solid #cdd9e6",fontSize:14,fontFamily:FM,background:"#fff",outline:"none",boxSizing:"border-box"}}/></div>
        <div style={{marginBottom:14}}><label style={{fontSize:10,fontWeight:700,color:"#1B5E20",marginBottom:4,display:"block"}}>FIELD / DIAMOND</label>
          <input value={field} onChange={e=>setField(e.target.value)} placeholder="e.g. Christie Pits Diamond 2" style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"2px solid #cdd9e6",fontSize:14,fontFamily:FM,background:"#fff",outline:"none",boxSizing:"border-box"}}/></div>
        <div><label style={{fontSize:10,fontWeight:700,color:"#1B5E20",marginBottom:6,display:"block"}}>HOME OR AWAY?</label>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setIsHome(false)} style={{flex:1,padding:"12px 0",borderRadius:10,border:"none",cursor:"pointer",background:!isHome?"#1B5E20":"#e8f5e9",color:!isHome?"#FFD600":"#1B5E20",fontWeight:800,fontSize:14,fontFamily:FM}}>AWAY (bat 1st)</button>
            <button onClick={()=>setIsHome(true)} style={{flex:1,padding:"12px 0",borderRadius:10,border:"none",cursor:"pointer",background:isHome?"#1B5E20":"#e8f5e9",color:isHome?"#FFD600":"#1B5E20",fontWeight:800,fontSize:14,fontFamily:FM}}>HOME (bat 2nd)</button></div></div></div>
      <div style={{background:"#f2f6fb",borderRadius:16,padding:20,marginBottom:16,border:"1px solid #cdd9e6"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <span style={{fontSize:12,fontWeight:700,color:"#5e6e82"}}>BATTING ORDER</span>
          <span style={{fontSize:11,color:"#2E7D32",fontWeight:600}}>{lineup.length} batter{lineup.length!==1?"s":""}</span></div>
        {!lineup.length&&<div style={{textAlign:"center",padding:"20px 10px",color:"#8b98ac",fontSize:13,fontStyle:"italic",border:"2px dashed #cdd9e6",borderRadius:10,marginBottom:12}}>
          {roster.length?"Tap players from the roster":"Add players below to get started"}</div>}
        {lineup.map((n,i)=><div key={n} draggable onDragStart={()=>setDragI(i)} onDragOver={e=>e.preventDefault()}
          onDrop={()=>{if(dragI!==null){const a=[...lineup];const[it]=a.splice(dragI,1);a.splice(i,0,it);setLineup(a);setDragI(null)}}}
          style={{display:"flex",alignItems:"center",gap:10,padding:"8px 12px",background:dragI===i?"#C8E6C9":(i%2===0?"#fff":"#eff3f9"),borderRadius:8,marginBottom:4,cursor:"grab",border:"1px solid #dce5f0"}}>
          <span style={{fontSize:10,color:"#5e6e82",cursor:"grab",userSelect:"none"}}>☰</span>
          <span style={{fontSize:14,fontWeight:800,color:"#1B5E20",fontFamily:FM,width:24,textAlign:"center"}}>{i+1}</span>
          <span style={{fontSize:14,fontWeight:600,color:"#333",flex:1}}>{n}</span>
          <button onClick={()=>setLineup(lineup.filter(x=>x!==n))} style={{background:"none",border:"none",color:"#F44336",cursor:"pointer",fontSize:18,lineHeight:1}}>×</button></div>)}
        {roster.length>0&&<div style={{marginTop:16}}>
          <div style={{fontSize:11,color:"#5e6e82",fontWeight:600,marginBottom:8}}>ROSTER (tap to add)</div>
          <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
            {roster.map(n=>{const inL=lineup.includes(n);return(<div key={n} style={{position:"relative",display:"inline-flex"}}>

                border:inL?"1px solid #C8E6C9":"1px solid #7e93b2",background:inL?"#e8f5e9":"transparent",
                color:inL?"#81C784":"#33414f",fontSize:12,fontWeight:600,cursor:inL?"default":"pointer",paddingRight:46}}>
                {n}{inL?" ✓":""}</button>
              {!locked&&<button onClick={()=>setRenameConf(n)} title="Rename" style={{position:"absolute",right:24,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#7e93b2",cursor:"pointer",fontSize:12,lineHeight:1}}>✎</button>}
              {!locked&&<button onClick={()=>setRmConf(n)} style={{position:"absolute",right:4,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:14,lineHeight:1}}>×</button>}</div>)})}</div></div>}
        <div style={{display:"flex",gap:8,marginTop:14}}>
          <input value={newP} onChange={e=>setNewP(e.target.value)} placeholder="Add new player" style={{flex:1,padding:"8px 12px",borderRadius:8,border:"1px solid #cdd9e6",fontSize:13,background:"#fff",outline:"none"}}
            onKeyDown={e=>{if(e.key==="Enter"&&newP.trim()){addP(newP.trim());setNewP("")}}}/>
          <button onClick={()=>{if(newP.trim()){addP(newP.trim());setNewP("")}}} style={{padding:"8px 16px",borderRadius:8,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:700,fontSize:13,cursor:"pointer"}}>+</button></div></div>
      {(()=>{
        const miss=[];
        if(!opp.trim())miss.push("opponent name");
        if(!field.trim())miss.push("diamond/field");
        if(!String(gNum).trim())miss.push("game #");
        if(!gDate)miss.push("date");
        if(lineup.length<1)miss.push("at least one batter");

          {!canStart&&<div style={{background:"#FFF3E0",border:"2px solid #FFB74D",borderRadius:10,padding:"10px 12px",marginBottom:10,fontSize:12,color:"#E65100",fontWeight:600,textAlign:"center"}}>

      })()}

          <div style={{fontSize:14,fontWeight:600,color:"#333",marginBottom:20}}>Remove {rmConf} from roster?</div>
          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>setRmConf(null)} style={{flex:1,padding:12,borderRadius:10,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:700,cursor:"pointer"}}>Cancel</button>
            <button onClick={()=>{setRoster(p=>p.filter(x=>x!==rmConf));setLineup(p=>p.filter(x=>x!==rmConf));setRmConf(null)}}
              style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#F44336",color:"#fff",fontWeight:700,cursor:"pointer"}}>Remove</button></div></div></div>}
      {showShare&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
        <div style={{background:"#f2f6fb",borderRadius:16,padding:20,maxWidth:380,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)",maxHeight:"90vh",overflowY:"auto"}}>
          {/* Share Roster */}
          <div style={{fontSize:14,fontWeight:700,color:"#1B5E20",marginBottom:4}}>Share Roster</div>
          <div style={{fontSize:11,color:"#5e6e82",marginBottom:8}}>Send this link to teammates who will be scoring games.</div>
          <div style={{background:"#fff",borderRadius:8,padding:8,border:"1px solid #cdd9e6",marginBottom:8,wordBreak:"break-all",fontSize:9,fontFamily:FM,color:"#555",maxHeight:60,overflowY:"auto"}}>
            {shareUrl()}</div>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <button onClick={copyShare} style={{flex:1,padding:10,borderRadius:10,border:"none",
              background:copied?"#4CAF50":"#FF9800",color:"#fff",fontWeight:800,fontSize:12,cursor:"pointer",transition:"background .3s"}}>
              {copied?"✓ COPIED!":"COPY ROSTER LINK"}</button>
          </div>

          {/* Share Stats (view-only) */}
          {ldT("sync_url","")&&<div>
            <div style={{borderTop:"1px solid #cdd9e6",paddingTop:16,marginBottom:4}}>
              <div style={{fontSize:14,fontWeight:700,color:"#4CAF50"}}>Share Stats (View Only)</div>
              <div style={{fontSize:11,color:"#5e6e82",marginBottom:8}}>Share this link in the group chat. Anyone can view team stats and game history — no editing, no setup needed.</div>
            </div>
            <div style={{background:"#fff",borderRadius:8,padding:8,border:"1px solid #cdd9e6",marginBottom:8,wordBreak:"break-all",fontSize:9,fontFamily:FM,color:"#555",maxHeight:60,overflowY:"auto"}}>
              {statsShareUrl()}</div>
            {(window.location.protocol!=="http:"&&window.location.protocol!=="https:")&&<div style={{background:"#FFEBEE",border:"1px solid #EF9A9A",borderRadius:8,padding:8,marginBottom:8,fontSize:10,color:"#C62828",fontWeight:600}}>
              This app is open from a file, not a web address — teammates can't open this link. Host the HTML online (e.g. GitHub Pages or Netlify) and share that address.</div>}
            <div style={{fontSize:10,color:"#5e6e82",marginBottom:8,fontStyle:"italic"}}>This link is self-contained — teammates can open it directly with no setup. Make sure you've synced your games first (SYNC button) so there's data to show.</div>
            <div style={{display:"flex",gap:8,marginBottom:8}}>
              <button onClick={()=>{const u=statsShareUrl();
                navigator.clipboard.writeText(u).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000)}).catch(()=>{
                const ta=document.createElement("textarea");ta.value=u;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);
                setCopied(true);setTimeout(()=>setCopied(false),2000)})}}
                style={{flex:1,padding:10,borderRadius:10,border:"none",
                  background:copied?"#4CAF50":"#4CAF50",color:"#fff",fontWeight:800,fontSize:12,cursor:"pointer"}}>
                COPY STATS LINK</button>
            </div>
          </div>}

          <button onClick={()=>{setShowShare(false);setCopied(false)}} style={{width:"100%",padding:12,borderRadius:10,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:700,cursor:"pointer",marginTop:4}}>Close</button>
        </div></div>}
    </div>);
}
