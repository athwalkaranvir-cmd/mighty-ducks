  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;

}
/* Stadium-night backdrop: field glow from below, floodlights up top */
body::before{content:"";position:fixed;inset:0;z-index:-3;
  background:
    radial-gradient(125% 80% at 50% 122%, rgba(0,230,118,.20), transparent 60%),
    radial-gradient(70% 45% at 18% -12%, rgba(255,214,0,.10), transparent 60%),
    radial-gradient(70% 45% at 84% -12%, rgba(0,200,255,.09), transparent 60%),
    linear-gradient(180deg,#070d18 0%,#0a1422 55%,#08130d 100%);}
/* Slow neon grid, faded at the edges */
body::after{content:"";position:fixed;inset:-2px;z-index:-2;
  background-image:linear-gradient(rgba(0,230,118,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,230,118,.07) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(125% 92% at 50% 28%,#000 38%,transparent 86%);

@keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:46px 46px,46px 46px}}

#root>div::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;

.hud-br{bottom:8px;right:8px;border-left:none;border-top:none;border-radius:0 0 6px 0}
::-webkit-scrollbar{width:9px;height:9px}

<script type="text/plain" id="app-src">
const {useState,useEffect,useRef} = React;
const APP_VERSION="BUILD 23 (edit completed games)";
let TEAM="MIGHTY DUCKS"; // reassigned from the active team below
const HITS=["1B","2B","3B","HR"];
const OUTS=["GO","SO","FO","FLO"];
const OTHER=["BB","SF","FC"];
const OC={"1B":"#4CAF50","2B":"#FF9800","3B":"#9C27B0","HR":"#F44336","BB":"#2196F3","SF":"#607D8B","FC":"#795548","GO":"#795548","SO":"#9E9E9E","FO":"#9E9E9E","FLO":"#9E9E9E"};
const OL={"1B":"Single","2B":"Double","3B":"Triple","HR":"Home Run","BB":"Walk","SF":"Sac Fly","FC":"Fielder's Choice","GO":"Ground Out","SO":"Strikeout","FO":"Foul Out","FLO":"Fly Out"};
const sv=(k,v)=>{try{localStorage.setItem("md_"+k,JSON.stringify(v))}catch(e){}};
const ld=(k,d)=>{try{const v=localStorage.getItem("md_"+k);return v?JSON.parse(v):d}catch(e){return d}};
// ══ Multi-team support ══
// Each team keeps its own games, roster, sheet connection etc. under a
// per-team key prefix. On the first run of this build we wrap the existing
// (single-team) data in a "Mighty Ducks" team so nothing is lost.
function migrateTeams(){
  let teams=ld("teams",null);
  if(teams&&teams.length)return teams;
  const id="mightyducks";
  teams=[{id:id,name:"MIGHTY DUCKS"}];
  ["games","roster","sync_url","sheet_link","active_game"].forEach(function(k){
    const oldV=localStorage.getItem("md_"+k);
    const newK="md_t_"+id+"_"+k;
    if(oldV!==null&&localStorage.getItem(newK)===null){try{localStorage.setItem(newK,oldV)}catch(e){}}
  });
  sv("teams",teams);sv("active_team",id);
  return teams;
}
let TEAMS=migrateTeams();
let TEAM_ID=ld("active_team",(TEAMS[0]||{}).id);
if(!TEAMS.some(function(t){return t.id===TEAM_ID})){TEAM_ID=(TEAMS[0]||{}).id;sv("active_team",TEAM_ID);}
TEAM=((TEAMS.find(function(t){return t.id===TEAM_ID}))||{name:"MY TEAM"}).name;
const tkey=k=>"t_"+TEAM_ID+"_"+k;            // key within the active team
const ldT=(k,d)=>ld(tkey(k),d);
const svT=(k,v)=>sv(tkey(k),v);
// Team management (these reload so all state re-reads the new team cleanly)
function switchTeam(id){sv("active_team",id);location.reload();}
function addTeam(name){const id="t"+Date.now().toString(36);const ts=ld("teams",[]);ts.push({id:id,name:name});sv("teams",ts);sv("active_team",id);location.reload();}
function renameTeam(id,name){const ts=ld("teams",[]).map(t=>t.id===id?{id:t.id,name:name}:t);sv("teams",ts);location.reload();}
function deleteTeam(id){let ts=ld("teams",[]);if(ts.length<=1)return;ts=ts.filter(t=>t.id!==id);sv("teams",ts);["games","roster","sync_url","sheet_link","active_game"].forEach(k=>{try{localStorage.removeItem("md_t_"+id+"_"+k)}catch(e){}});if(ld("active_team","")===id)sv("active_team",ts[0].id);location.reload();}
const FM="'Fira Mono',monospace";

function Diamond({bases,last,ab}){
  const bp={home:{x:150,y:270},first:{x:255,y:165},second:{x:150,y:60},third:{x:45,y:165}};
  const hr=last==="HR";
  return(<svg viewBox="0 0 300 320" style={{width:"100%",maxWidth:300,margin:"0 auto",display:"block"}}>
    <rect x="0" y="0" width="300" height="320" rx="16" fill="#2d5016" opacity="0.15"/>
    <polygon points="150,270 255,165 150,60 45,165" fill="none" stroke="#33414f" strokeWidth="2" opacity="0.5"/>
    {[["home","first"],["first","second"],["second","third"],["third","home"]].map(([f,t],i)=>
      <line key={i} x1={bp[f].x} y1={bp[f].y} x2={bp[t].x} y2={bp[t].y} stroke="#7e93b2" strokeWidth="3" opacity="0.4"/>)}
    {["first","second","third"].map(b=>{const p=bp[b],r=bases[b];return(<g key={b}>
      <rect x={p.x-14} y={p.y-14} width={28} height={28} rx={4} transform={`rotate(45 ${p.x} ${p.y})`}
        fill={r?"#FFD600":"#edf1f8"} stroke={r?"#FF8F00":"#5e6e82"} strokeWidth={r?3:2} style={{filter:r?"drop-shadow(0 0 12px #FFD600)":"none",transition:"all .4s"}}/>
      {r&&<circle cx={p.x} cy={p.y} r={6} fill="#1B5E20"/>}
      {r&&<text x={p.x} y={p.y+(b==="second"?-22:22)} textAnchor="middle" fill="#1B5E20" style={{fontSize:9,fontWeight:700,fontFamily:FM}}>{r}</text>}
    </g>)})}
    <polygon points="150,284 138,274 138,262 162,262 162,274" fill={hr?"#FFD600":"#edf1f8"} stroke={hr?"#FF8F00":"#5e6e82"} strokeWidth={2}/>
    {ab&&<text x={150} y={310} textAnchor="middle" fill="#1B5E20" style={{fontSize:11,fontWeight:700,fontFamily:FM}}>AB: {ab}</text>}
    {hr&&<circle cx={150} cy={165} r={120} fill="none" stroke="#FFD600" strokeWidth="3" opacity="0.3">
      <animate attributeName="r" from="80" to="140" dur="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" from="0.5" to="0" dur="1s" repeatCount="indefinite"/></circle>}
  </svg>);
}

function Scoreboard({opp,ourS,oppS,isHome}){
  const oSc=ourS||{},opSc=oppS||{};
  const mx=Math.max(...[...Object.keys(oSc),...Object.keys(opSc)].map(Number).filter(n=>!isNaN(n)),1);
  const inn=[];for(let i=1;i<=mx;i++)inn.push(i);
  const ourT=Object.values(oSc).reduce((a,b)=>a+b,0),oppT=Object.values(opSc).reduce((a,b)=>a+b,0);
  const aN=isHome?(opp||"OPP"):TEAM,hN=isHome?TEAM:(opp||"OPP");
  const aS=isHome?opSc:oSc,hS=isHome?oSc:opSc;
  return(<div style={{background:"#f2f6fb",borderRadius:12,padding:10,marginTop:12,border:"1px solid #cdd9e6",overflowX:"auto"}}>
    <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:FM}}>
      <thead><tr style={{background:"#1B5E20"}}>
        <th style={{padding:"5px 6px",color:"#FFD600",fontWeight:700,fontSize:9,textAlign:"left",minWidth:60}}>TEAM</th>
        {inn.map(i=><th key={i} style={{padding:"5px 3px",color:"#FFD600",fontWeight:700,fontSize:9,textAlign:"center"}}>{i}</th>)}
        <th style={{padding:"5px 5px",color:"#FFD600",fontWeight:800,fontSize:10,textAlign:"center",borderLeft:"2px solid #FFD600"}}>R</th>
      </tr></thead>
      <tbody>
        <tr style={{background:"#fff"}}><td style={{padding:"4px 6px",fontWeight:700,fontSize:10,color:"#1B5E20"}}>{aN}</td>
          {inn.map(i=><td key={i} style={{padding:"4px 3px",textAlign:"center",color:"#333"}}>{aS[i]!=null?aS[i]:0}</td>)}
          <td style={{padding:"4px 5px",textAlign:"center",fontWeight:800,color:"#1B5E20",borderLeft:"2px solid #cdd9e6"}}>{isHome?oppT:ourT}</td></tr>
        <tr style={{background:"#ebf0f7"}}><td style={{padding:"4px 6px",fontWeight:700,fontSize:10,color:"#1B5E20"}}>{hN}</td>
          {inn.map(i=><td key={i} style={{padding:"4px 3px",textAlign:"center",color:"#333"}}>{hS[i]!=null?hS[i]:0}</td>)}
          <td style={{padding:"4px 5px",textAlign:"center",fontWeight:800,color:"#1B5E20",borderLeft:"2px solid #cdd9e6"}}>{isHome?ourT:oppT}</td></tr>
      </tbody></table></div>);
}

function aggStats(games){
  const c={};games.filter(g=>g.plays).forEach(game=>{const inG=new Set();
    (game.plays||[]).forEach(p=>{const n=p.batter,o=p.outcome;inG.add(n);
      if(!c[n])c[n]={G:0,AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0,SO:0,FO:0,GO:0,SF:0,FC:0,FLO:0};
      const s=c[n];if(!["BB","SF","FC"].includes(o))s.AB++;
      if(HITS.includes(o)){s.H++;s[o]++}else if(OUTS.includes(o)){if(s[o]!==undefined)s[o]++}
      else if(o==="BB")s.BB++;else if(o==="SF")s.SF++;else if(o==="FC")s.FC++;
      s.RBI+=(p.rbi||0)});
    (game.plays||[]).forEach(p=>{(p.scoredPlayers||[]).forEach(n=>{
      if(!c[n])c[n]={G:0,AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0,SO:0,FO:0,GO:0,SF:0,FC:0,FLO:0};c[n].R++})});
    inG.forEach(n=>{if(c[n])c[n].G++})});return c;
}

const MIN_PCT=0.4;// 40% of team games to qualify for rankings

// Format a rate stat baseball-style: 0.333 -> ".333", "—" when no at-bats
function fmt3(v,ab){return ab>0?v.toFixed(3).replace(/^0\./,"."):"—"}
function statLine(s){
  const ab=s.AB||0,h=s.H||0,bb=s.BB||0,sf=s.SF||0;
  const avg=ab>0?h/ab:0;
  const tb=(s["1B"]||0)+(s["2B"]||0)*2+(s["3B"]||0)*3+(s.HR||0)*4;
  const slg=ab>0?tb/ab:0;
  const pa=ab+bb+sf;const obp=pa>0?(h+bb)/pa:0;
  return{ab,avg,slg,obp};
}
// Full-roster stat tables, sized to fit a phone with no sideways scrolling.
// Split into two stacked tables because all 20 columns can't fit one screen.
function StatsTables({pl,onPlayer}){
  // One wide table: player name frozen on the left, every stat scrolls sideways.
  // Tap any column header to sort by that stat. Default: alphabetical by name.
  const [sortKey,setSortKey]=useState("name");
  const [dir,setDir]=useState(1); // 1 = A→Z / high→low per column default
  // [label, displayFn, sortValueFn]
  const cols=[
    ["GP",s=>s.G||0,s=>s.G||0],["AB",s=>statLine(s).ab,s=>statLine(s).ab],["R",s=>s.R||0,s=>s.R||0],["H",s=>s.H||0,s=>s.H||0],
    ["1B",s=>s["1B"]||0,s=>s["1B"]||0],["2B",s=>s["2B"]||0,s=>s["2B"]||0],["3B",s=>s["3B"]||0,s=>s["3B"]||0],["HR",s=>s.HR||0,s=>s.HR||0],
    ["RBI",s=>s.RBI||0,s=>s.RBI||0],["BB",s=>s.BB||0,s=>s.BB||0],["SO",s=>s.SO||0,s=>s.SO||0],["GO",s=>s.GO||0,s=>s.GO||0],
    ["FO",s=>s.FO||0,s=>s.FO||0],["FLO",s=>s.FLO||0,s=>s.FLO||0],["SF",s=>s.SF||0,s=>s.SF||0],["FC",s=>s.FC||0,s=>s.FC||0],
    ["AVG",s=>{const l=statLine(s);return{v:fmt3(l.avg,l.ab),c:"#1565C0"}},s=>statLine(s).avg],
    ["OBP",s=>{const l=statLine(s);return{v:fmt3(l.obp,l.ab),c:"#FF6F00"}},s=>statLine(s).obp],
    ["SLG",s=>{const l=statLine(s);return{v:fmt3(l.slg,l.ab),c:"#9C27B0"}},s=>statLine(s).slg]
  ];
  const clickCol=(key)=>{
    if(key===sortKey){setDir(d=>-d);return}
    setSortKey(key);setDir(key==="name"?1:-1); // names A→Z, stats high→low by default
  };
  const rows=[...pl].sort((a,b)=>{
    if(sortKey==="name")return dir*a[0].localeCompare(b[0]);
    const col=cols.find(c=>c[0]===sortKey);if(!col)return 0;
    return dir*(col[2](b[1])-col[2](a[1])); // dir=-1 default => high→low
  });
  const nameW=96;
  const arrow=(key)=>sortKey===key?(dir<0?" ▼":" ▲"):"";
  const hCell={padding:"8px 8px",color:"#FFD600",fontWeight:800,fontSize:9,textAlign:"center",whiteSpace:"nowrap",cursor:"pointer",userSelect:"none"};
  const nameHead={...hCell,position:"sticky",left:0,zIndex:3,background:sortKey==="name"?"#2E7D32":"#1B5E20",textAlign:"left",minWidth:nameW,width:nameW,boxShadow:"2px 0 4px rgba(0,0,0,.12)"};
  return(<div>
    <div style={{overflowX:"auto",WebkitOverflowScrolling:"touch",borderRadius:12,border:"1px solid #cdd9e6",background:"#fff"}}>
      <table style={{borderCollapse:"collapse",width:"max-content",minWidth:"100%"}}>
        <thead><tr style={{background:"#1B5E20"}}>
          <th style={nameHead} onClick={()=>clickCol("name")}>PLAYER{arrow("name")}</th>
          {cols.map(c=><th key={c[0]} onClick={()=>clickCol(c[0])} style={{...hCell,minWidth:38,background:sortKey===c[0]?"#2E7D32":"transparent"}}>{c[0]}{arrow(c[0])}</th>)}</tr></thead>
        <tbody>{rows.map(([n,s],i)=>{const bg=i%2===0?"#fff":"#edf1f8";
          return(<tr key={n} style={{background:bg,borderTop:"1px solid #e1e8f2"}}>
            <td onClick={onPlayer?()=>onPlayer(n):undefined}
              style={{position:"sticky",left:0,zIndex:1,background:bg,padding:"8px 8px",fontWeight:700,fontSize:12,minWidth:nameW,width:nameW,
                whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",boxShadow:"2px 0 4px rgba(0,0,0,.07)",
                color:onPlayer?"#1565C0":"#1B5E20",textDecoration:onPlayer?"underline":"none",cursor:onPlayer?"pointer":"default"}}>{n}</td>
            {cols.map((c,j)=>{const v=c[1](s);const ob=v!==null&&typeof v==="object";
              return <td key={j} style={{padding:"8px 4px",textAlign:"center",fontSize:11,fontFamily:FM,minWidth:38,
                color:ob?v.c:"#333",fontWeight:ob?800:400}}>{ob?v.v:v}</td>})}
          </tr>)})}</tbody></table></div>
    <div style={{fontSize:11,color:"#1B5E20",fontWeight:800,marginTop:8}}>← Swipe sideways to see every stat. Tap any column heading to sort by it.{onPlayer?" Tap a name for the full profile.":""}</div>
  </div>);
}

// ─── Box score (per-game batting lines) computed from plays ───
function gameBox(plays,lineup){
  const stats={};
  const ensure=n=>{if(n&&!stats[n])stats[n]={AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0};return stats[n]};
  (lineup||[]).forEach(ensure);
  (plays||[]).forEach(p=>{const s=ensure(p.batter);if(!s)return;const o=p.outcome;
    if(!["BB","SF","FC"].includes(o))s.AB++;
    if(HITS.includes(o)){s.H++;s[o]++}
    if(o==="BB")s.BB++;
    s.RBI+=(p.rbi||0)});
  (plays||[]).forEach(p=>{(p.scoredPlayers||[]).forEach(n=>{const s=ensure(n);if(s)s.R++})});
  const order=(lineup&&lineup.length?lineup.filter(n=>stats[n]):Object.keys(stats));
  return order.map(n=>[n,stats[n]]);
}
// Per-player game-by-game log from local games (includes opponent + date + each at-bat's outcome)
function playerGameLog(games,name){
  const out=[];
  (games||[]).filter(g=>g.plays).forEach(g=>{
    const box=gameBox(g.plays,g.lineup);
    const row=box.find(e=>e[0]===name);
    if(row){const s=row[1];
      const outcomes=(g.plays||[]).filter(p=>p.batter===name).map(p=>p.outcome);
      out.push({date:g.date,opponent:g.opponent,AB:s.AB,R:s.R,H:s.H,
        "1B":s["1B"],"2B":s["2B"],"3B":s["3B"],HR:s.HR,RBI:s.RBI,BB:s.BB,outcomes:outcomes})}
  });
  return out;
}
// The list of result chips to show for one game. Local games carry the real
// at-bat order in `outcomes`; cloud rows only have counts, so synthesize hits+walks.
function gameOutcomeChips(g){
  if(Array.isArray(g.outcomes)&&g.outcomes.length)return g.outcomes;
  const out=[];["HR","3B","2B","1B"].forEach(k=>{for(let i=0;i<(g[k]||0);i++)out.push(k)});
  for(let i=0;i<(g.BB||0);i++)out.push("BB");
  return out;
}
function OutcomeChips({list}){
  if(!list||!list.length)return <span style={{fontSize:10,color:"#8b98ac"}}>—</span>;
  return(<div style={{display:"flex",flexWrap:"wrap",gap:4}}>
    {list.map((o,i)=><span key={i} style={{fontSize:9,fontWeight:800,fontFamily:FM,color:"#fff",
      background:OC[o]||"#9E9E9E",borderRadius:5,padding:"2px 6px"}}>{o}</span>)}
  </div>);
}
function BoxScore({plays,lineup}){
  const rows=gameBox(plays,lineup);
  if(!rows.length)return null;
  const cols=["AB","R","H","RBI","BB","2B","3B","HR","AVG"];
  return(<div style={{borderRadius:12,border:"1px solid #cdd9e6",overflow:"hidden",background:"#fff"}}>
    <table style={{width:"100%",borderCollapse:"collapse",tableLayout:"fixed"}}>
      <thead><tr style={{background:"#1B5E20"}}>
        <th style={{padding:"7px 2px",color:"#FFD600",fontWeight:800,fontSize:8,textAlign:"left",paddingLeft:8,width:72}}>PLAYER</th>
        {cols.map(c=><th key={c} style={{padding:"7px 1px",color:"#FFD600",fontWeight:800,fontSize:8,textAlign:"center"}}>{c}</th>)}</tr></thead>

// ─── Weekly MVP helpers ───
function weekStart(dateStr){
  let d=new Date(dateStr+"T00:00:00");
  if(isNaN(d))d=new Date(dateStr);
  if(isNaN(d))return dateStr;
  const day=(d.getDay()+6)%7; // Monday = 0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10);
}
function weekLabel(ws){
  const d=new Date(ws+"T00:00:00");if(isNaN(d))return ws;
  const e=new Date(d);e.setDate(e.getDate()+6);
  const f=x=>x.toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return f(d)+" – "+f(e);
}
// Build per-game batting lines from local games (only ones flagged for awards)
function localGameLines(games){
  const lines=[];
  (games||[]).filter(g=>g.plays&&g.awardEligible!==false).forEach(g=>{
    const per={};
    const ensure=n=>{if(n&&!per[n])per[n]={player:n,date:g.date,AB:0,H:0,R:0,RBI:0,HR:0,"1B":0,"2B":0,"3B":0,BB:0};return per[n]};
    (g.lineup||[]).forEach(ensure);
    (g.plays||[]).forEach(p=>{const s=ensure(p.batter);if(!s)return;const o=p.outcome;
      if(!["BB","SF","FC"].includes(o))s.AB++;
      if(HITS.includes(o)){s.H++;s[o]++}
      if(o==="BB")s.BB++;
      s.RBI+=(p.rbi||0)});
    (g.plays||[]).forEach(p=>{(p.scoredPlayers||[]).forEach(n=>{const s=ensure(n);if(s)s.R++})});
    Object.values(per).forEach(s=>{if(s.AB>0||s.H>0||s.R>0||s.RBI>0||s.BB>0)lines.push(s)});
  });
  return lines;
}
// Build per-game lines from cloud per-player sheets
function cloudGameLines(playerGames){
  const lines=[];
  Object.entries(playerGames||{}).forEach(([name,rows])=>{
    (rows||[]).forEach(r=>lines.push({player:name,date:r.date,AB:r.AB||0,H:r.H||0,R:r.R||0,
      RBI:r.RBI||0,HR:r.HR||0,"1B":r["1B"]||0,"2B":r["2B"]||0,"3B":r["3B"]||0,BB:r.BB||0}));
  });
  return lines;
}
function weeklyMVPs(lines){
  const weeks={};
  (lines||[]).forEach(l=>{const ws=weekStart(l.date);
    if(!weeks[ws])weeks[ws]={};const w=weeks[ws];
    if(!w[l.player])w[l.player]={name:l.player,AB:0,H:0,R:0,RBI:0,HR:0,TB:0,BB:0,G:0};
    const s=w[l.player];
    s.AB+=l.AB||0;s.H+=l.H||0;s.R+=l.R||0;s.RBI+=l.RBI||0;s.HR+=l.HR||0;s.BB+=l.BB||0;s.G++;
    s.TB+=(l["1B"]||0)+(l["2B"]||0)*2+(l["3B"]||0)*3+(l.HR||0)*4});
  return Object.entries(weeks).map(([ws,players])=>{
    const scored=Object.values(players).filter(s=>s.AB>0).map(s=>{
      const avg=s.AB>0?s.H/s.AB:0;
      const score=(s.H*2)+(s.TB*1.5)+(s.RBI*2)+(s.R*1.5)+(s.HR*3)+(s.BB*0.5)+(avg*5);
      return{...s,avg,score}}).sort((a,b)=>b.score-a.score);
    return{weekStart:ws,mvp:scored[0]||null,players:scored};
  }).filter(w=>w.mvp).sort((a,b)=>a.weekStart<b.weekStart?1:-1);
}
function WeeklyMVPSection({lines,note}){
  const weeks=weeklyMVPs(lines);
  if(!weeks.length)return(<div style={{textAlign:"center",padding:40,color:"#8b98ac"}}>
    {note||"No games yet."}</div>);
  return(<div>
    {weeks.map(w=>{const m=w.mvp;return(<div key={w.weekStart} style={{marginBottom:16}}>
      <div style={{fontSize:11,fontWeight:800,color:"#5e6e82",letterSpacing:1,marginBottom:6}}>WEEK OF {weekLabel(w.weekStart)}</div>
      <div style={{background:"linear-gradient(135deg,#1B5E20,#2E7D32)",borderRadius:16,padding:18,boxShadow:"0 6px 20px rgba(27,94,32,.25)"}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{fontSize:34,lineHeight:1}}>🏆</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontSize:10,color:"#A5D6A7",fontWeight:700,letterSpacing:1}}>WEEKLY MVP</div>
            <div style={{fontSize:22,fontWeight:900,color:"#FFD600",fontFamily:FM,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{m.name}</div></div>
          <div style={{textAlign:"right",flexShrink:0}}>
            <div style={{fontSize:20,fontWeight:900,color:"#fff",fontFamily:FM}}>{fmt3(m.avg,m.AB)}</div>
            <div style={{fontSize:9,color:"#A5D6A7"}}>AVG</div></div>
        </div>
        <div style={{display:"flex",gap:16,marginTop:12,flexWrap:"wrap"}}>
          {[["H-AB",m.H+"-"+m.AB],["R",m.R],["RBI",m.RBI],["HR",m.HR],["GP",m.G]].map(([l,v])=>
            <div key={l}><span style={{fontSize:15,fontWeight:800,color:"#fff",fontFamily:FM}}>{v}</span>
              <span style={{fontSize:9,color:"#A5D6A7",marginLeft:4}}>{l}</span></div>)}
        </div>
      </div>
      {w.players.length>1&&<div style={{marginTop:6,paddingLeft:2,fontSize:10,color:"#5e6e82"}}>
        Runners-up: {w.players.slice(1,3).map(p=>`${p.name} (${fmt3(p.avg,p.AB)})`).join(", ")}</div>}
    </div>)})}
  </div>);
}

// ─── Season Awards (MLB-style) ───
function hitStreak(log){
  const s=(log||[]).slice().sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  let best=0,cur=0;s.forEach(g=>{if((g.H||0)>0){cur++;if(cur>best)best=cur}else cur=0});return best;
}
function mvpScore(s){const l=statLine(s);const tb=(s["1B"]||0)+(s["2B"]||0)*2+(s["3B"]||0)*3+(s.HR||0)*4;
  return (s.H||0)*2+tb*1.5+(s.RBI||0)*2+(s.R||0)*1.5+(s.HR||0)*3+(s.BB||0)*0.5+l.avg*5;}
function AwardCard({icon,title,name,statLabel,statVal,accent}){
  if(!name)return null;
  return(<div style={{background:"linear-gradient(135deg,#0a1422,#12243a)",borderRadius:14,padding:"14px 16px",border:`1px solid ${accent}55`,boxShadow:`inset 0 0 22px ${accent}18`}}>

      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:9,letterSpacing:2,fontWeight:800,color:accent}}>{title}</div>
        <div style={{fontSize:20,fontWeight:900,color:"#eafff2",fontFamily:FM,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{name}</div></div>
      {statVal!=null&&<div style={{textAlign:"right",flexShrink:0}}>
        <div style={{fontSize:18,fontWeight:900,color:"#fff",fontFamily:FM}}>{statVal}</div>
        <div style={{fontSize:8,color:accent,letterSpacing:1}}>{statLabel}</div></div>}
    </div></div>);
}
function SeasonAwards({pl,minG,logFor,note}){
  if(!pl.length)return(<div style={{textAlign:"center",padding:24,color:"#8b98ac",fontSize:13}}>{note||"No games yet."}</div>);
  const qual=pl.filter(([,s])=>(s.G||0)>=minG);
  const top=(arr,val)=>{const a=[...arr].sort((x,y)=>val(y[1])-val(x[1]));return a[0]&&val(a[0][1])>0?a[0]:null;};
  const topQ=(val)=>{const a=[...qual].sort((x,y)=>val(y[1])-val(x[1]));return a[0]||null;};
  const mvp=topQ(mvpScore);
  const champ=topQ(s=>statLine(s).avg);
  const slug=topQ(s=>statLine(s).obp+statLine(s).slg);
  const hr=top(pl,s=>s.HR||0);
  const rbi=top(pl,s=>s.RBI||0);
  // Hot bat streak
  let hbName=null,hbVal=0;pl.forEach(([n])=>{const v=hitStreak(logFor?logFor(n):[]);if(v>hbVal){hbVal=v;hbName=n}});
  // Triple Crown: same player leads AVG, HR, RBI
  const tc=(champ&&hr&&rbi&&champ[0]===hr[0]&&champ[0]===rbi[0])?champ[0]:null;
  const anyQual=qual.length>0;
  return(<div>
    {tc&&<div style={{background:"linear-gradient(135deg,#7a5c00,#b8860b)",borderRadius:14,padding:"14px 16px",marginBottom:10,textAlign:"center",boxShadow:"0 6px 20px rgba(184,134,11,.35)"}}>
      <div style={{fontSize:26}}>👑</div>
      <div style={{fontSize:10,letterSpacing:2,fontWeight:800,color:"#fff3cc"}}>TRIPLE CROWN</div>
      <div style={{fontSize:22,fontWeight:900,color:"#fff",fontFamily:FM}}>{tc}</div>
      <div style={{fontSize:10,color:"#fff3cc",marginTop:2}}>Leads the team in AVG, HR and RBI</div></div>}
    <div style={{display:"grid",gap:8}}>
      {!anyQual&&<div style={{fontSize:11,color:"#8b98ac",fontStyle:"italic",textAlign:"center",padding:"4px 0"}}>MVP, Batting Champion & Silver Slugger need {minG}+ games to qualify.</div>}
      <AwardCard icon="🏆" title="SEASON MVP" name={mvp&&mvp[0]} statLabel="AVG" statVal={mvp?fmt3(statLine(mvp[1]).avg,statLine(mvp[1]).ab):null} accent="#FFD600"/>
      <AwardCard icon="🥇" title="BATTING CHAMPION" name={champ&&champ[0]} statLabel="AVG" statVal={champ?fmt3(statLine(champ[1]).avg,statLine(champ[1]).ab):null} accent="#00e676"/>
      <AwardCard icon="💥" title="SILVER SLUGGER" name={slug&&slug[0]} statLabel="OPS" statVal={slug?fmt3(statLine(slug[1]).obp+statLine(slug[1]).slg,statLine(slug[1]).ab):null} accent="#9C27B0"/>
      <AwardCard icon="🚀" title="HOME RUN KING" name={hr&&hr[0]} statLabel="HR" statVal={hr?(hr[1].HR||0):null} accent="#F44336"/>
      <AwardCard icon="🏏" title="RBI LEADER" name={rbi&&rbi[0]} statLabel="RBI" statVal={rbi?(rbi[1].RBI||0):null} accent="#2196F3"/>
      {hbVal>=2&&<AwardCard icon="🔥" title="HOT BAT (STREAK)" name={hbName} statLabel="GAMES" statVal={hbVal} accent="#FF9800"/>}
    </div>
  </div>);
}

// ─── Play-by-play (used live during a game and in the game breakdown) ───
function playDetail(p){
  const parts=[];
  if((p.rbi||0)>0)parts.push(`${p.rbi} RBI`);
  const sc=p.scoredPlayers||[];
  if(sc.length)parts.push(`${sc.join(", ")} scored`);
  if(p.fcInfo&&p.fcInfo.player)parts.push(`${p.fcInfo.player} out at ${p.fcInfo.base}`);
  if((p.extraOuts||0)>0)parts.push(`${p.extraOuts} out on the bases`);
  return parts.join(" • ");
}
function PlayRow({p}){
  const detail=playDetail(p);const scored=(p.scoredPlayers||[]).length>0;
  return(<div style={{display:"flex",gap:10,alignItems:"flex-start",padding:"8px 0",borderBottom:"1px solid #e6ecf4"}}>
    <span style={{flexShrink:0,minWidth:34,textAlign:"center",padding:"3px 5px",borderRadius:7,background:OC[p.outcome]||"#9E9E9E",color:"#fff",fontWeight:800,fontSize:11,fontFamily:FM}}>{p.outcome}</span>
    <div style={{flex:1,minWidth:0}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1B5E20"}}>{p.batter} <span style={{fontWeight:500,color:"#5e6e82",fontSize:11}}>{OL[p.outcome]||p.outcome}</span></div>
      {detail&&<div style={{fontSize:11,color:scored?"#2E7D32":"#5e6e82",marginTop:1,fontWeight:scored?700:400}}>{detail}</div>}
    </div>
  </div>);
}
function PlayByPlay({plays,ourS,oppS,reverse}){
  const inns=new Set();
  (plays||[]).forEach(p=>inns.add(p.inning));
  Object.keys(ourS||{}).forEach(k=>inns.add(+k));
  Object.keys(oppS||{}).forEach(k=>inns.add(+k));
  let list=[...inns].filter(n=>n>=1).sort((a,b)=>a-b);
  if(reverse)list=list.reverse();
  if(!list.length)return(<div style={{textAlign:"center",padding:24,color:"#8b98ac",fontSize:13}}>No plays yet — they'll show up here as you score.</div>);
  return(<div>
    {list.map(n=>{
      let ip=(plays||[]).filter(p=>p.inning===n);
      if(reverse)ip=[...ip].reverse();
      const our=(ourS||{})[n]||0,opp=(oppS||{})[n]||0;
      return(<div key={n} style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4,padding:"0 2px"}}>
          <span style={{fontSize:12,fontWeight:800,color:"#5e6e82",letterSpacing:1}}>INNING {n}</span>
          <span style={{fontSize:11,fontWeight:700,color:"#1B5E20"}}>{TEAM} {our} · {opp} OPP</span></div>
        <div style={{background:"#fff",borderRadius:12,border:"1px solid #cdd9e6",padding:"4px 12px"}}>
          {ip.length===0&&<div style={{padding:"8px 0",fontSize:12,color:"#8b98ac"}}>No at-bats recorded.</div>}
          {ip.map((p,i)=><PlayRow key={i} p={p}/>)}
          {opp>0&&<div style={{padding:"8px 0 4px",fontSize:12,fontWeight:700,color:"#F44336"}}>Opponent scored {opp} run{opp!==1?"s":""}</div>}
        </div>
      </div>);
    })}
  </div>);
}

        <button onClick={()=>delPlay(i)} style={{background:"none",border:"none",color:"#F44336",cursor:"pointer",fontSize:20,lineHeight:1,padding:"0 2px"}}>×</button>
      </div>
      <div style={{display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>

        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
          {names.map(n=>{const on=(p.scoredPlayers||[]).includes(n);return(
            <button key={n} onClick={()=>toggleScored(i,n)} style={{padding:"5px 9px",borderRadius:7,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,
              background:on?"#1B5E20":"#edf1f8",color:on?"#fff":"#5e6e82"}}>{n}{on?" ✓":""}</button>)})}</div>

    </div>))}
    <div style={{display:"flex",gap:10,marginTop:4,marginBottom:30}}>
      <button onClick={onCancel} style={{flex:1,padding:14,borderRadius:12,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:800,cursor:"pointer"}}>CANCEL</button>
      <button onClick={save} style={{flex:2,padding:14,borderRadius:12,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:900,fontSize:15,cursor:"pointer"}}>SAVE CHANGES</button>
    </div>
  </div>);
}

function GameDetail({game,onBack,onEdit,locked}){
  const plays=game.plays||[];const stats={};
  (game.lineup||[]).forEach(n=>{stats[n]={AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0}});
  plays.forEach(p=>{const s=stats[p.batter];if(!s)return;if(!["BB","SF","FC"].includes(p.outcome))s.AB++;if(HITS.includes(p.outcome)){s.H++;s[p.outcome]++}if(p.outcome==="BB")s.BB++;s.RBI+=(p.rbi||0)});
  plays.forEach(p=>{(p.scoredPlayers||[]).forEach(n=>{if(stats[n])stats[n].R++})});
  const ourR=Object.values(game.ourScoreByInning||{}).reduce((a,b)=>a+b,0);
  const oppR=Object.values(game.oppScoreByInning||{}).reduce((a,b)=>a+b,0);
  return(<div style={{maxWidth:520,margin:"0 auto",padding:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
      <button onClick={onBack} style={{padding:"6px 14px",borderRadius:8,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontSize:12,fontWeight:700,cursor:"pointer"}}>BACK</button>
      {onEdit&&!locked&&<button onClick={onEdit} style={{padding:"6px 14px",borderRadius:8,border:"none",background:"#FF9800",color:"#fff",fontSize:12,fontWeight:800,cursor:"pointer"}}>✎ EDIT GAME</button>}
    </div>
    <div style={{textAlign:"center",marginBottom:16}}>
      <div style={{fontSize:20,fontWeight:900,color:"#1B5E20",fontFamily:FM}}>{TEAM} {ourR} — {oppR} {game.opponent||"OPP"}</div>
      <div style={{fontSize:12,color:"#5e6e82",marginTop:4}}>{game.date}{game.field?` • ${game.field}`:""}</div></div>
    <Scoreboard opp={game.opponent} ourS={game.ourScoreByInning} oppS={game.oppScoreByInning} isHome={game.isHome}/>
    <div style={{overflowX:"auto",borderRadius:12,border:"1px solid #cdd9e6",marginTop:16}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:FM}}>
        <thead><tr style={{background:"#1B5E20"}}>{["PLAYER","AB","R","H","1B","2B","3B","HR","RBI","BB","AVG"].map(h=>
          <th key={h} style={{padding:"7px 4px",color:"#FFD600",fontWeight:700,fontSize:9}}>{h}</th>)}</tr></thead>
        <tbody>{(game.lineup||[]).map((n,i)=>{const s=stats[n]||{AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0};
          const avg=s.AB>0?(s.H/s.AB).toFixed(3):"-";
          return(<tr key={n} style={{background:i%2===0?"#f2f6fb":"#fff"}}>
            <td style={{padding:"5px 8px",fontWeight:600,color:"#1B5E20",whiteSpace:"nowrap"}}>{n}</td>
            {[s.AB,s.R,s.H,s["1B"],s["2B"],s["3B"],s.HR,s.RBI,s.BB].map((v,j)=>
              <td key={j} style={{padding:"5px 3px",textAlign:"center",color:"#333"}}>{v}</td>)}
            <td style={{padding:"5px 3px",textAlign:"center",fontWeight:700,color:"#1565C0"}}>{avg}</td></tr>)})}</tbody></table></div>
    <div style={{marginTop:22}}>
      <div style={{fontSize:13,fontWeight:800,color:"#1B5E20",letterSpacing:1,marginBottom:10}}>PLAY-BY-PLAY</div>
      <PlayByPlay plays={plays} ourS={game.ourScoreByInning} oppS={game.oppScoreByInning}/>
    </div>
  </div>);
}

function HistoryPage({games,onBack,onView,onDelete,locked}){
  const [delC,setDelC]=useState(null);
  const [cloudGames,setCloudGames]=useState(null);
  const [loading,setLoading]=useState(false);

  useEffect(()=>{
    const syncUrl=ldT("sync_url","");
    if(!syncUrl)return;
    setLoading(true);
    fetch(syncUrl+"?action=stats").then(r=>r.json()).then(d=>{
      if(d.status==="ok"&&d.games&&d.games.length>0)setCloudGames(d.games);
      setLoading(false)}).catch(()=>setLoading(false));
  },[]);

  // Merge local and cloud games, deduplicate by date+opponent+gameNum
  const allGames=[];
  const seen=new Set();
  // Local games first (have full play data)
  games.forEach(g=>{const key=(g.date||"")+"_"+(g.opponent||"")+"_"+(g.gameNum||"");seen.add(key);allGames.push({...g,source:"local"})});
  // Cloud games that aren't already local
  if(cloudGames){cloudGames.forEach(g=>{const key=(g.date||"")+"_"+(g.opponent||"")+"_"+(g.gameNum||"");
    if(!seen.has(key)){seen.add(key);allGames.push({date:g.date,opponent:g.opponent,gameNum:g.gameNum,field:g.field,
      isHome:g.homeAway==="HOME",ourScoreByInning:{1:g.ourScore||0},oppScoreByInning:{1:g.oppScore||0},
      result:g.result,source:"cloud"})}})}

  return(<div style={{maxWidth:480,margin:"0 auto",padding:20}}>
    <button onClick={onBack} style={{padding:"6px 14px",borderRadius:8,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontSize:12,fontWeight:700,cursor:"pointer",marginBottom:16}}>BACK</button>
    <div style={{textAlign:"center",marginBottom:20}}><div style={{fontSize:22,fontWeight:900,color:"#1B5E20",fontFamily:FM}}>GAME HISTORY</div></div>
    {loading&&<div style={{textAlign:"center",padding:12,color:"#5e6e82",fontSize:12}}>Loading from Google Sheets...</div>}
    {allGames.length===0&&!loading?<div style={{textAlign:"center",padding:40,color:"#8b98ac"}}>No games yet.</div>:
      allGames.slice().reverse().map((g,i)=>{
        const oR=g.source==="cloud"?(g.ourScoreByInning?Object.values(g.ourScoreByInning).reduce((a,b)=>a+b,0):0):Object.values(g.ourScoreByInning||{}).reduce((a,b)=>a+b,0);
        const opR=g.source==="cloud"?(g.oppScoreByInning?Object.values(g.oppScoreByInning).reduce((a,b)=>a+b,0):0):Object.values(g.oppScoreByInning||{}).reduce((a,b)=>a+b,0);
        const w=oR>opR,t=oR===opR;
        return(<div key={g.id||i} style={{position:"relative",marginBottom:8}}>
          <button onClick={()=>{if(g.source==="local")onView(g)}} style={{display:"block",width:"100%",padding:"16px 40px 16px 16px",borderRadius:12,border:"1px solid #cdd9e6",background:"#f2f6fb",cursor:g.source==="local"?"pointer":"default",textAlign:"left"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div><div style={{fontSize:14,fontWeight:700,color:"#1B5E20"}}>vs {g.opponent||"?"}</div>
                <div style={{fontSize:11,color:"#5e6e82",marginTop:2}}>{g.date}{g.field?` • ${g.field}`:""}</div>
                {g.source==="cloud"&&<div style={{fontSize:9,color:"#2196F3",fontWeight:600,marginTop:2}}>FROM GOOGLE SHEETS</div>}</div>
              <div style={{textAlign:"right"}}>
                <div style={{fontSize:20,fontWeight:900,fontFamily:FM,color:w?"#4CAF50":t?"#FF9800":"#F44336"}}>{oR} - {opR}</div>
                <div style={{fontSize:10,fontWeight:700,color:w?"#4CAF50":t?"#FF9800":"#F44336"}}>{w?"WIN":t?"TIE":"LOSS"}</div></div></div></button>
          {g.source==="local"&&!locked&&<button onClick={e=>{e.stopPropagation();setDelC(g.id||i)}} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:"#ccc",cursor:"pointer",fontSize:20,padding:4}}>×</button>}
        </div>)})}
    {delC!==null&&<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#f2f6fb",borderRadius:16,padding:24,maxWidth:320,width:"100%",textAlign:"center",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
        <div style={{fontSize:14,fontWeight:600,color:"#333",marginBottom:8}}>Delete this game?</div>
        <div style={{fontSize:12,color:"#5e6e82",marginBottom:20}}>Stats will be permanently removed.</div>
        <div style={{display:"flex",gap:10}}>
          <button onClick={()=>setDelC(null)} style={{flex:1,padding:12,borderRadius:10,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:700,cursor:"pointer"}}>Cancel</button>
          <button onClick={()=>{onDelete(delC);setDelC(null)}} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#F44336",color:"#fff",fontWeight:700,cursor:"pointer"}}>Delete</button></div></div></div>}
  </div>);
}

function SyncPage({games,onBack,onSynced,sheetLink,setSheetLink}){
  const [url,setUrl]=useState(()=>ldT("sync_url",""));const [status,setStatus]=useState("");const [busy,setBusy]=useState(false);
  const [localSheet,setLocalSheet]=useState(sheetLink||"");
  const un=games.filter(g=>!g.synced);useEffect(()=>{if(url)svT("sync_url",url)},[url]);
  // Warn if this URL is already used by a DIFFERENT team — that would mix their stats
  const dupTeam=(()=>{const u=(url||"").trim();if(!u)return null;
    const ts=ld("teams",[]);for(let i=0;i<ts.length;i++){if(ts[i].id!==TEAM_ID&&(ld("t_"+ts[i].id+"_sync_url","")||"").trim()===u)return ts[i].name;}return null;})();
  const doSync=async()=>{if(!url.trim()){setStatus("Paste your Apps Script URL above.");return}
    if(dupTeam){setStatus("That Sheet belongs to \""+dupTeam+"\". Make a new Sheet for "+TEAM+" first so stats don't mix.");return}
    if(!un.length){setStatus("All synced!");return}
    setBusy(true);setStatus("Syncing "+un.length+" game(s)...");
    try{const r=await fetch(url.trim(),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"sync_all",games:un})});
      const d=await r.json();if(d.status==="ok"){setStatus("✓ Synced "+un.length+" game(s)!");onSynced(un.map(g=>g.id))}
      else setStatus("Error: "+(d.message||"Unknown"))}catch(e){setStatus("Failed: "+e.message)}setBusy(false)};
  const doTest=async()=>{if(!url.trim()){setStatus("Paste URL first.");return}setBusy(true);setStatus("Testing...");
    try{const r=await fetch(url.trim());const d=await r.json();setStatus(d.status==="ok"?"✓ Connected!":"Unexpected: "+JSON.stringify(d))}
    catch(e){setStatus("Failed: "+e.message)}setBusy(false)};
  const saveSheet=()=>{setSheetLink(localSheet);svT("sheet_link",localSheet);setStatus("✓ Sheet link saved!")};
  const withPlays=games.filter(g=>g.plays&&g.plays.length);
  const doBackfill=async()=>{if(!url.trim()){setStatus("Paste your Apps Script URL above.");return}
    if(!withPlays.length){setStatus("No play-by-play to upload yet.");return}
    setBusy(true);setStatus("Uploading play-by-play...");
    try{const r=await fetch(url.trim(),{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action:"sync_plays",games:withPlays.map(g=>({id:g.id,date:g.date,opponent:g.opponent,gameNum:g.gameNum,plays:g.plays}))})});
      const d=await r.json();
      if(d.status==="ok"){
        if((d.updated||0)>0)setStatus("✓ Play-by-play uploaded for "+d.updated+" game(s)! Teammates can now see it.");
        else if((d.rows||0)===0)setStatus("The Sheet has no games in its GAME LOG yet. Sync your games first, then run this again.");
        else setStatus("Sent "+(d.received||0)+" game(s) but none matched the "+(d.rows||0)+" row(s) in GAME LOG.\nMost likely fix: in Apps Script, use Deploy → Manage deployments → ✏️ → New version → Deploy, then try again.");
      }else if((d.message||"").toLowerCase().includes("unknown action"))
        setStatus("Your Google Apps Script is still running the OLD code.\nFix: paste the new script, then Deploy → Manage deployments → ✏️ edit → Version: New version → Deploy. (A brand-new deployment creates a different URL — edit the existing one instead.)");
      else setStatus("Error: "+(d.message||"Unknown"))}catch(e){setStatus("Failed: "+e.message)}setBusy(false)};
  const doRebuild=async()=>{if(!url.trim()){setStatus("Paste your Apps Script URL above.");return}
    setBusy(true);setStatus("Rebuilding team summary...");
    try{const r=await fetch(url.trim(),{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"rebuild"})});
      const d=await r.json();if(d.status==="ok")setStatus("✓ Team summary rebuilt to match the player tabs.");
      else if((d.message||"").toLowerCase().includes("unknown action"))setStatus("Your Apps Script is the old version. Paste the new script, then Deploy → Manage deployments → ✏️ → New version → Deploy.");
      else setStatus("Error: "+(d.message||"Unknown"))}catch(e){setStatus("Failed: "+e.message)}setBusy(false)};
  return(<div style={{maxWidth:480,margin:"0 auto",padding:20}}>
    <button onClick={onBack} style={{padding:"6px 14px",borderRadius:8,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontSize:12,fontWeight:700,cursor:"pointer",marginBottom:16}}>BACK</button>
    <div style={{textAlign:"center",marginBottom:14}}><div style={{fontSize:22,fontWeight:900,color:"#1B5E20",fontFamily:FM}}>SYNC SETTINGS</div></div>

    {/* Which team you're connecting */}
    <div style={{background:"#0a1422",borderRadius:14,padding:"12px 16px",marginBottom:14,border:"1px solid rgba(0,230,118,.4)"}}>
      <div style={{fontSize:10,letterSpacing:2,color:"#7fe9b4",fontWeight:700}}>CONNECTING THIS TEAM</div>
      <div style={{fontSize:20,fontWeight:900,color:"#eafff2",fontFamily:FM,marginTop:2}}>{TEAM}</div>
      <div style={{fontSize:10,color:"#9fb4c6",marginTop:4,lineHeight:1.5}}>Each team needs its <b>own separate Google Sheet</b>. Don't reuse another team's Sheet or their stats will mix.</div>
    </div>
    {dupTeam&&<div style={{background:"#4a1515",border:"2px solid #F44336",borderRadius:12,padding:"12px 14px",marginBottom:14}}>
      <div style={{fontSize:12,fontWeight:800,color:"#ff8a80"}}>⚠ This Sheet already belongs to "{dupTeam}"</div>
      <div style={{fontSize:11,color:"#ffb3ac",marginTop:4,lineHeight:1.5}}>Using it here will mix {TEAM}'s stats with {dupTeam}'s. Make a brand-new Google Sheet for {TEAM} and paste that URL instead.</div>
    </div>}

    {/* Google Sheet Link */}
    <div style={{background:"#f2f6fb",borderRadius:16,padding:20,border:"1px solid #cdd9e6",marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color:"#4CAF50",letterSpacing:1,marginBottom:10}}>GOOGLE SHEET LINK</div>
      <div style={{fontSize:11,color:"#5e6e82",marginBottom:8}}>Paste your Google Sheet URL here. This gets included when you share the roster link with teammates.</div>
      <input value={localSheet} onChange={e=>setLocalSheet(e.target.value)} placeholder="https://docs.google.com/spreadsheets/d/..."
        style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #cdd9e6",fontSize:11,fontFamily:FM,background:"#fff",outline:"none",boxSizing:"border-box"}}/>
      <button onClick={saveSheet} style={{width:"100%",padding:12,borderRadius:10,border:"none",background:"#4CAF50",color:"#fff",fontWeight:800,fontSize:13,cursor:"pointer",marginTop:8}}>
        SAVE SHEET LINK</button>
    </div>

    {/* Sync Section */}
    <div style={{background:"#f2f6fb",borderRadius:16,padding:20,border:"1px solid #cdd9e6",marginBottom:16}}>
      <div style={{fontSize:12,fontWeight:700,color:"#1B5E20",letterSpacing:1,marginBottom:6}}>SYNC GAMES</div>
      <div style={{fontSize:11,color:"#5e6e82",marginBottom:10}}>Games upload only when you choose to — either at save time or with the button below. Nothing syncs on its own.</div>
      <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:12}}>
        <div style={{width:14,height:14,borderRadius:"50%",background:un.length?"#FF9800":"#4CAF50",flexShrink:0}}/>
        <span style={{fontSize:14,color:"#333",fontWeight:600}}>{un.length?`${un.length} pending`:"All synced"}</span></div>
      <label style={{fontSize:11,fontWeight:700,color:"#1B5E20",marginBottom:6,display:"block"}}>APPS SCRIPT URL</label>
      <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." style={{width:"100%",padding:"10px 12px",borderRadius:10,border:"2px solid #cdd9e6",fontSize:11,fontFamily:FM,background:"#fff",outline:"none",boxSizing:"border-box"}}/>
      <div style={{display:"flex",gap:8,marginTop:12}}>
        <button onClick={doTest} disabled={busy} style={{flex:1,padding:12,borderRadius:10,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontWeight:700,fontSize:12,cursor:busy?"default":"pointer",opacity:busy?.5:1}}>TEST</button>
        <button onClick={doSync} disabled={busy||!un.length} style={{flex:2,padding:12,borderRadius:10,border:"none",background:(busy||!un.length)?"#ccc":"#1B5E20",color:"#FFD600",fontWeight:800,fontSize:13,cursor:(busy||!un.length)?"default":"pointer"}}>
          {busy?"SYNCING...":"SYNC "+un.length}</button></div>
      <button onClick={doBackfill} disabled={busy} style={{width:"100%",marginTop:8,padding:11,borderRadius:10,border:"2px solid #1B5E20",background:"transparent",color:"#1B5E20",fontWeight:700,fontSize:12,cursor:busy?"default":"pointer",opacity:busy?.5:1}}>
        SHARE PLAY-BY-PLAY FOR ALL GAMES</button>
      <div style={{fontSize:10,color:"#5e6e82",marginTop:6,fontStyle:"italic"}}>Uploads the play-by-play of already-synced games so teammates can see it on the share link. (New games include it automatically.)</div>
      <button onClick={doRebuild} disabled={busy} style={{width:"100%",marginTop:8,padding:11,borderRadius:10,border:"2px solid #795548",background:"transparent",color:"#795548",fontWeight:700,fontSize:12,cursor:busy?"default":"pointer",opacity:busy?.5:1}}>
        FIX / REBUILD TEAM SUMMARY</button>
      <div style={{fontSize:10,color:"#5e6e82",marginTop:6,fontStyle:"italic"}}>Recomputes the TEAM SUMMARY tab from each player's tab, so the totals line up again.</div>
      {status&&<div style={{marginTop:12,padding:12,borderRadius:8,background:status.includes("✓")?"#e8f5e9":"#fff3e0",color:status.includes("✓")?"#2E7D32":"#E65100",fontSize:12,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{status}</div>}
    </div>

    <div style={{background:"#f2f6fb",borderRadius:16,padding:20,border:"1px solid #cdd9e6"}}>
      <div style={{fontSize:12,fontWeight:700,color:"#1B5E20",marginBottom:12}}>SETUP GUIDE</div>
      <div style={{fontSize:12,color:"#555",lineHeight:1.8}}>
        {["Create a blank Google Sheet","Extensions → Apps Script → paste the Mighty Ducks script","Deploy → New Deployment → Web App → Access: Anyone","Copy the Apps Script URL → paste in APPS SCRIPT URL above","Copy the Sheet URL → paste in GOOGLE SHEET LINK above","Done — everything syncs automatically from here"].map((t,i)=>
          <div key={i} style={{marginBottom:10,paddingLeft:28,position:"relative"}}>
            <span style={{position:"absolute",left:0,width:22,height:22,borderRadius:"50%",background:"#1B5E20",color:"#FFD600",fontWeight:800,fontSize:11,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:FM}}>{i+1}</span>{t}</div>)}</div></div>
  </div>);
}

// ─── Outcome Modal ───
function OutModal({batter,outcome,onOk,onNo,bases}){
  const isHR=outcome==="HR",isFC=outcome==="FC",isSF=outcome==="SF";
  const isGO=outcome==="GO",isFLO=outcome==="FLO";
  const isOut=OUTS.includes(outcome);
  const reachBase=HITS.includes(outcome)||outcome==="BB"||isFC;
  const rl=[];
  if(bases.third)rl.push({name:bases.third,from:"3rd"});
  if(bases.second)rl.push({name:bases.second,from:"2nd"});
  if(bases.first)rl.push({name:bases.first,from:"1st"});
  const hasR=rl.length>0;

  // GO/FLO/SF with runners: need to ask about runner advancement
  const outWithRunners=(isGO||isFLO||isSF)&&hasR;

  const getDef=()=>{const d={};
    if(isHR){rl.forEach(r=>d[r.name]="scored");d[batter]="scored";return d}
    rl.forEach(r=>{
      if(outcome==="1B"||outcome==="BB"){d[r.name]=r.from==="3rd"?"scored":r.from==="2nd"?"3rd":"2nd"}
      else if(outcome==="2B"){d[r.name]=(r.from==="3rd"||r.from==="2nd")?"scored":"3rd"}
      else if(outcome==="3B"){d[r.name]="scored"}
      else if(isSF){d[r.name]=r.from==="3rd"?"scored":"stay"}
      else if(isFLO){d[r.name]="stay"}// fly out: runners stay unless tagged up
      else if(isGO){d[r.name]="stay"}// ground out: runners stay unless forced
      else if(isFC){d[r.name]=r.from==="3rd"?"scored":r.from==="2nd"?"3rd":"2nd"}
      else{d[r.name]="stay"}});return d};
  const [adv,setAdv]=useState(getDef);
  const [fcPlayer,setFcPlayer]=useState(rl.length?rl[rl.length-1].name:"");
  const [fcBase,setFcBase]=useState(rl.length?rl[rl.length-1].from:"1st");
  const setRA=(n,v)=>setAdv(p=>({...p,[n]:v}));
  const getOpts=(f,allowOut)=>{const o=[{v:"stay",l:"Stay"}];
    if(f==="1st")o.push({v:"2nd",l:"→ 2nd"},{v:"3rd",l:"→ 3rd"},{v:"scored",l:"→ Scored"});
    if(f==="2nd")o.push({v:"3rd",l:"→ 3rd"},{v:"scored",l:"→ Scored"});
    if(f==="3rd")o.push({v:"scored",l:"→ Scored"});
    if(allowOut)o.push({v:"out",l:"OUT"});
    return o};
  const sp=Object.entries(adv).filter(([n,v])=>v==="scored"&&!(isFC&&n===fcPlayer)).map(([n])=>n);
  const outsOnPlay=Object.entries(adv).filter(([n,v])=>v==="out"&&!(isFC&&n===fcPlayer)).map(([n])=>n);
  const showRunners=((reachBase||outWithRunners)&&hasR)||isHR;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#f2f6fb",borderRadius:20,padding:24,maxWidth:400,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)",maxHeight:"92vh",overflowY:"auto"}}>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{fontSize:13,color:"#5e6e82",fontWeight:600}}>{batter}</div>
          <div style={{display:"inline-block",marginTop:6,padding:"5px 16px",borderRadius:20,background:OC[outcome],color:"#fff",fontWeight:800,fontSize:15,fontFamily:FM}}>
            {OL[outcome]}</div></div>

        {/* FC: pick which player got out and at which base */}
        {isFC&&hasR&&<div style={{marginBottom:14}}>
          <label style={{fontSize:11,fontWeight:700,color:"#1B5E20"}}>WHICH RUNNER GOT OUT?</label>
          <div style={{display:"flex",flexDirection:"column",gap:6,marginTop:6}}>
            {rl.map(r=><button key={r.name} onClick={()=>{setFcPlayer(r.name);setFcBase(r.from)}}
              style={{padding:"10px 14px",borderRadius:10,border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",
                background:fcPlayer===r.name?"#795548":"#e9eef6",color:fcPlayer===r.name?"#fff":"#795548",fontWeight:700,fontSize:13,fontFamily:FM}}>
              <span>{r.name}</span><span>on {r.from}</span></button>)}</div>
          {fcPlayer&&<div style={{marginTop:8}}>
            <label style={{fontSize:11,fontWeight:700,color:"#1B5E20"}}>OUT AT WHICH BASE?</label>
            <div style={{display:"flex",gap:6,marginTop:6}}>
              {["1st","2nd","3rd","Home"].map(b=><button key={b} onClick={()=>setFcBase(b)} style={{flex:1,padding:"8px 0",borderRadius:8,border:"none",cursor:"pointer",
                background:fcBase===b?"#795548":"#e9eef6",color:fcBase===b?"#fff":"#795548",fontWeight:700,fontSize:12}}>{b}</button>)}</div></div>}
        </div>}
        {isFC&&!hasR&&<div style={{marginBottom:14}}>
          <label style={{fontSize:11,fontWeight:700,color:"#1B5E20"}}>OUT AT WHICH BASE?</label>
          <div style={{display:"flex",gap:6,marginTop:6}}>
            {["1st","2nd","3rd","Home"].map(b=><button key={b} onClick={()=>setFcBase(b)} style={{flex:1,padding:"8px 0",borderRadius:8,border:"none",cursor:"pointer",
              background:fcBase===b?"#795548":"#e9eef6",color:fcBase===b?"#fff":"#795548",fontWeight:700,fontSize:12}}>{b}</button>)}</div></div>}

        {/* HR: auto score everyone */}
        {isHR&&<div style={{marginBottom:14}}>
          <label style={{fontSize:11,fontWeight:700,color:"#1B5E20"}}>EVERYONE SCORES</label>
          <div style={{display:"flex",flexDirection:"column",gap:4,marginTop:6}}>
            {[...rl.map(r=>r.name),batter].map(n=>
              <div key={n} style={{padding:"8px 14px",borderRadius:8,background:"#1B5E20",color:"#FFD600",fontWeight:700,fontSize:13,fontFamily:FM,display:"flex",justifyContent:"space-between"}}>
                <span>{n}</span><span>✓ SCORED</span></div>)}</div></div>}

        {/* Runners section for hits, BB, FC, GO, FLO, SF */}
        {showRunners&&!isHR&&<div style={{marginBottom:14}}>
          <label style={{fontSize:11,fontWeight:700,color:"#1B5E20",letterSpacing:1}}>
            {outWithRunners?"RUNNERS (tag up? double play?)":"RUNNERS"}</label>
          <div style={{display:"flex",flexDirection:"column",gap:8,marginTop:8}}>
            {rl.map(r=>{
              if(isFC&&r.name===fcPlayer)return null;// FC out player already handled
              const allowOut=true;// runners can get out on any play (thrown out advancing, double play, etc)
              const opts=getOpts(r.from,allowOut);const cur=adv[r.name]||"stay";
              return(<div key={r.name} style={{background:"#fff",borderRadius:10,padding:12,border:"1px solid #cdd9e6"}}>
                <div style={{fontSize:12,fontWeight:700,color:"#1B5E20",marginBottom:6}}>{r.name} <span style={{fontWeight:400,color:"#5e6e82"}}>(on {r.from})</span></div>
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {opts.map(o=><button key={o.v} onClick={()=>setRA(r.name,o.v)}
                    style={{padding:"6px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:11,fontWeight:700,fontFamily:FM,
                      background:cur===o.v?(o.v==="scored"?"#1B5E20":o.v==="out"?"#F44336":"#FF9800"):"#e8f5e9",
                      color:cur===o.v?"#fff":"#1B5E20"}}>{o.l}</button>)}</div></div>)})}
          </div>
          {sp.length>0&&<div style={{marginTop:8,textAlign:"center",fontSize:13,fontWeight:800,color:"#1B5E20"}}>{sp.length} run{sp.length!==1?"s":""} scored</div>}
          {outsOnPlay.length>0&&<div style={{marginTop:4,textAlign:"center",fontSize:12,fontWeight:700,color:"#F44336"}}>{outsOnPlay.join(", ")} thrown out on the bases</div>}
        </div>}

        <div style={{display:"flex",gap:10,marginTop:4}}>
          <button onClick={onNo} style={{flex:1,padding:12,borderRadius:10,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:700,fontSize:13,cursor:"pointer"}}>Cancel</button>
          <button onClick={()=>{const fs=isHR?[...rl.map(r=>r.name),batter]:sp;
            const rbi=isHR?rl.length+1:isSF?sp.length:sp.filter(n=>n!==batter).length;
            const fcInfo=isFC?{player:fcPlayer,base:fcBase}:null;
            onOk(rbi,fs.includes(batter)?1:0,fs,fcInfo,adv,outsOnPlay.length)}}
            style={{flex:2,padding:12,borderRadius:10,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:800,fontSize:13,cursor:"pointer"}}>Confirm</button>
        </div></div></div>);
}

// ─── Daily Awards (MVP of the day) ───
function DailyAwards({games,date,onDone}){
  // Get all award-eligible games from this date
  const todayGames=games.filter(g=>g.date===date&&g.plays&&g.awardEligible!==false);
  if(todayGames.length<2)return(<div style={{maxWidth:480,margin:"0 auto",padding:20,textAlign:"center"}}>
    <div style={{fontSize:14,color:"#5e6e82",marginBottom:16}}>Play your 2nd game tonight to see the daily MVP!</div>
    <button onClick={onDone} style={{padding:"12px 24px",borderRadius:10,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:800,fontSize:14,cursor:"pointer"}}>CONTINUE</button>
  </div>);

  // Aggregate stats across today's games
  const dayStats={};
  todayGames.forEach(g=>{
    (g.plays||[]).forEach(p=>{
      const n=p.batter,o=p.outcome;
      if(!dayStats[n])dayStats[n]={AB:0,H:0,R:0,RBI:0,HR:0,"2B":0,"3B":0,TB:0,BB:0};
      const s=dayStats[n];
      if(!["BB","SF","FC"].includes(o))s.AB++;
      if(HITS.includes(o)){s.H++;
        if(o==="1B")s.TB+=1;if(o==="2B"){s.TB+=2;s["2B"]++}if(o==="3B"){s.TB+=3;s["3B"]++}if(o==="HR"){s.TB+=4;s.HR++}}
      if(o==="BB")s.BB++;
      s.RBI+=(p.rbi||0);
    });
    (g.plays||[]).forEach(p=>{(p.scoredPlayers||[]).forEach(n=>{if(dayStats[n])dayStats[n].R++})});
  });

  // Score each player: weighted formula
  // Hits matter, extra base hits matter more, RBI/R matter, AVG matters
  const scored=Object.entries(dayStats).filter(([,s])=>s.AB>0).map(([name,s])=>{
    const avg=s.AB>0?s.H/s.AB:0;
    const score=(s.H*2)+(s.TB*1.5)+(s.RBI*2)+(s.R*1.5)+(s.HR*3)+(s.BB*0.5)+(avg*5);
    return{name,s,avg,score};
  }).sort((a,b)=>b.score-a.score);

  if(scored.length<1)return(<div style={{maxWidth:480,margin:"0 auto",padding:20,textAlign:"center"}}>
    <button onClick={onDone} style={{padding:"12px 24px",borderRadius:10,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:800,fontSize:14,cursor:"pointer"}}>CONTINUE</button>
  </div>);

  const mvp=scored[0];

  return(<div style={{maxWidth:480,margin:"0 auto",padding:20}}>
    <div style={{textAlign:"center",marginBottom:20}}>
      <div style={{fontSize:12,color:"#5e6e82",fontWeight:600,letterSpacing:2}}>GAME NIGHT AWARDS</div>
      <div style={{fontSize:11,color:"#5e6e82",marginTop:4}}>{date}</div>
    </div>

    {/* MVP */}
    <div style={{background:"linear-gradient(135deg,#1B5E20,#2E7D32)",borderRadius:16,padding:24,marginBottom:16,textAlign:"center",boxShadow:"0 8px 32px rgba(27,94,32,.3)"}}>
      <div style={{fontSize:36,marginBottom:4}}>🏆</div>
      <div style={{fontSize:12,color:"#A5D6A7",fontWeight:600,letterSpacing:2}}>MVP OF THE DAY</div>
      <div style={{fontSize:28,fontWeight:900,color:"#FFD600",fontFamily:FM,marginTop:8}}>{mvp.name}</div>
      <div style={{display:"flex",justifyContent:"center",gap:16,marginTop:12}}>
        <div><div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:FM}}>{mvp.s.H}-{mvp.s.AB}</div>
          <div style={{fontSize:9,color:"#A5D6A7"}}>H-AB</div></div>
        <div><div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:FM}}>{mvp.avg.toFixed(3)}</div>
          <div style={{fontSize:9,color:"#A5D6A7"}}>AVG</div></div>
        <div><div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:FM}}>{mvp.s.RBI}</div>
          <div style={{fontSize:9,color:"#A5D6A7"}}>RBI</div></div>
        <div><div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:FM}}>{mvp.s.R}</div>
          <div style={{fontSize:9,color:"#A5D6A7"}}>R</div></div>
        {mvp.s.HR>0&&<div><div style={{fontSize:18,fontWeight:800,color:"#fff",fontFamily:FM}}>{mvp.s.HR}</div>
          <div style={{fontSize:9,color:"#A5D6A7"}}>HR</div></div>}
      </div>
    </div>

    <button onClick={onDone} style={{width:"100%",padding:16,borderRadius:14,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:900,fontSize:16,cursor:"pointer",fontFamily:FM,boxShadow:"0 6px 24px rgba(27,94,32,.3)"}}>DONE</button>
  </div>);
}

function Summary({gd,plays,ourS,oppS,onSave,canUpload}){
  const stats={};(gd.lineup||[]).forEach(n=>{stats[n]={AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0}});
  plays.forEach(p=>{const s=stats[p.batter];if(!s)return;if(!["BB","SF","FC"].includes(p.outcome))s.AB++;
    if(HITS.includes(p.outcome)){s.H++;s[p.outcome]++}if(p.outcome==="BB")s.BB++;s.RBI+=(p.rbi||0);
    (p.scoredPlayers||[]).forEach(n=>{if(stats[n])stats[n].R++})});
  const oT=Object.values(ourS).reduce((a,b)=>a+b,0),opT=Object.values(oppS).reduce((a,b)=>a+b,0);
  const w=oT>opT,t=oT===opT;
  const [award,setAward]=useState(true);
  const [upload,setUpload]=useState(true);
  return(<div style={{maxWidth:520,margin:"0 auto",padding:20}}>
    <div style={{textAlign:"center",marginBottom:16}}>
      <div style={{fontSize:14,color:"#5e6e82",fontWeight:600}}>GAME COMPLETE</div>
      <div style={{fontSize:28,fontWeight:900,fontFamily:FM,color:w?"#4CAF50":t?"#FF9800":"#F44336",marginTop:8}}>{oT} — {opT}</div>
      <div style={{fontSize:16,fontWeight:700,color:w?"#4CAF50":t?"#FF9800":"#F44336"}}>{w?"WIN":t?"TIE":"LOSS"}</div>
      <div style={{fontSize:12,color:"#5e6e82",marginTop:4}}>vs {gd.opponent||"?"} • {gd.date}</div></div>
    <Scoreboard opp={gd.opponent} ourS={ourS} oppS={oppS} isHome={gd.isHome}/>
    <div style={{overflowX:"auto",borderRadius:12,border:"1px solid #cdd9e6",marginTop:16}}>
      <table style={{width:"100%",borderCollapse:"collapse",fontSize:11,fontFamily:FM}}>
        <thead><tr style={{background:"#1B5E20"}}>{["PLAYER","AB","R","H","1B","2B","3B","HR","RBI","BB","AVG"].map(h=>
          <th key={h} style={{padding:"7px 4px",color:"#FFD600",fontWeight:700,fontSize:9}}>{h}</th>)}</tr></thead>
        <tbody>{(gd.lineup||[]).map((n,i)=>{const s=stats[n]||{AB:0,R:0,H:0,"1B":0,"2B":0,"3B":0,HR:0,RBI:0,BB:0};
          const avg=s.AB>0?(s.H/s.AB).toFixed(3):"-";
          return(<tr key={n} style={{background:i%2===0?"#f2f6fb":"#fff"}}>
            <td style={{padding:"5px 8px",fontWeight:600,color:"#1B5E20",whiteSpace:"nowrap"}}>{n}</td>
            {[s.AB,s.R,s.H,s["1B"],s["2B"],s["3B"],s.HR,s.RBI,s.BB].map((v,j)=>
              <td key={j} style={{padding:"5px 3px",textAlign:"center",color:"#333"}}>{v}</td>)}
            <td style={{padding:"5px 3px",textAlign:"center",fontWeight:700,color:"#1565C0"}}>{avg}</td></tr>)})}</tbody></table></div>
    <div style={{background:"#f2f6fb",borderRadius:14,padding:16,marginTop:16,border:"1px solid #cdd9e6"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1B5E20",marginBottom:4,textAlign:"center"}}>Count this game toward MVP awards?</div>
      <div style={{fontSize:11,color:"#5e6e82",marginBottom:10,textAlign:"center"}}>Skip it for practice games, makeups, or test runs.</div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setAward(true)} style={{flex:1,padding:12,borderRadius:10,border:"none",cursor:"pointer",fontFamily:FM,
          background:award?"#1B5E20":"#e8f5e9",color:award?"#FFD600":"#1B5E20",fontWeight:800,fontSize:13}}>{award?"✓ YES, COUNT IT":"YES, COUNT IT"}</button>
        <button onClick={()=>setAward(false)} style={{flex:1,padding:12,borderRadius:10,border:"none",cursor:"pointer",fontFamily:FM,
          background:!award?"#5e6e82":"#ebf0f7",color:!award?"#fff":"#5e6e82",fontWeight:800,fontSize:13}}>{!award?"✓ DON'T COUNT":"DON'T COUNT"}</button></div></div>
    {canUpload&&<div style={{background:"#f2f6fb",borderRadius:14,padding:16,marginTop:12,border:"1px solid #cdd9e6"}}>
      <div style={{fontSize:13,fontWeight:700,color:"#1B5E20",marginBottom:4,textAlign:"center"}}>Upload this game to Google Sheets?</div>
      <div style={{fontSize:11,color:"#5e6e82",marginBottom:10,textAlign:"center"}}>This is what teammates see on the share link. You can also upload later from the Sync page.</div>
      <div style={{display:"flex",gap:8}}>
        <button onClick={()=>setUpload(true)} style={{flex:1,padding:12,borderRadius:10,border:"none",cursor:"pointer",fontFamily:FM,
          background:upload?"#1B5E20":"#e8f5e9",color:upload?"#FFD600":"#1B5E20",fontWeight:800,fontSize:13}}>{upload?"✓ YES, UPLOAD":"YES, UPLOAD"}</button>
        <button onClick={()=>setUpload(false)} style={{flex:1,padding:12,borderRadius:10,border:"none",cursor:"pointer",fontFamily:FM,
          background:!upload?"#5e6e82":"#ebf0f7",color:!upload?"#fff":"#5e6e82",fontWeight:800,fontSize:13}}>{!upload?"✓ KEEP LOCAL":"KEEP LOCAL"}</button></div></div>}
    <button onClick={()=>onSave(award,canUpload&&upload)} style={{width:"100%",padding:16,borderRadius:14,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:900,fontSize:16,cursor:"pointer",marginTop:16,fontFamily:FM,boxShadow:"0 6px 24px rgba(27,94,32,.3)"}}>SAVE GAME</button>
  </div>);
}

// ═══ MAIN APP ═══
function RenameModal({player,roster,onLocalRename,onClose,syncUrl}){
  const [val,setVal]=useState(player);
  const [busy,setBusy]=useState(false);
  const [msg,setMsg]=useState(null);
  const go=async()=>{
    const nn=val.trim();
    if(!nn||nn===player){onClose();return}
    if((roster||[]).some(x=>x!==player&&x.toLowerCase()===nn.toLowerCase())){setMsg("A player named \u201c"+nn+"\u201d already exists. Pick a different name."); return}
    onLocalRename(player,nn); // update app immediately
    if(!syncUrl){setMsg("\u2713 Renamed to \u201c"+nn+"\u201d. All past stats carried over."); return}
    setBusy(true);setMsg("Updating Google Sheet\u2026");
    try{
      const r=await fetch(syncUrl,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"rename_player",oldName:player,newName:nn})});
      const d=await r.json();
      if(d.status==="ok")setMsg("\u2713 Renamed to \u201c"+nn+"\u201d everywhere \u2014 app and Google Sheet. Stats carried over.");
      else if((d.message||"").toLowerCase().includes("unknown action"))setMsg("\u2713 Renamed in the app. To update the Sheet, redeploy the latest Apps Script (Manage deployments \u2192 \u270f \u2192 New version), then rename again.");
      else if((d.message||"").toLowerCase().includes("already exists"))setMsg("\u2713 Renamed in the app, but the Sheet already has a \u201c"+nn+"\u201d tab, so it wasn't renamed there.");
      else setMsg("\u2713 Renamed in the app. Sheet issue: "+(d.message||"unknown"));
    }catch(e){setMsg("\u2713 Renamed in the app. Couldn't reach the Sheet (offline?) \u2014 rename again when online to update it.");}
    setBusy(false);
  };
  return(<div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#f2f6fb",borderRadius:16,padding:22,maxWidth:340,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
      {msg===null?<React.Fragment>
        <div style={{fontSize:16,fontWeight:800,color:"#1B5E20",marginBottom:4}}>Rename player</div>
        <div style={{fontSize:12,color:"#5e6e82",marginBottom:14}}><b>{player}</b>'s entire history moves to the new name \u2014 nothing is lost.</div>
        <input value={val} onChange={e=>setVal(e.target.value)} autoFocus
          onKeyDown={e=>{if(e.key==="Enter")go()}}
          style={{width:"100%",padding:"11px 12px",borderRadius:10,border:"1px solid #cdd9e6",fontSize:15,background:"#fff",outline:"none",marginBottom:14,boxSizing:"border-box"}}/>
        <div style={{display:"flex",gap:10}}>
          <button onClick={onClose} style={{flex:1,padding:12,borderRadius:10,border:"2px solid #7e93b2",background:"transparent",color:"#5e6e82",fontWeight:700,cursor:"pointer"}}>Cancel</button>
          <button onClick={go} style={{flex:1,padding:12,borderRadius:10,border:"none",background:"#1B5E20",color:"#FFD600",fontWeight:800,cursor:"pointer"}}>Rename</button></div>

function App(){

  const [inn,setInn]=useState(savedActive?savedActive.inn:1);const [outs,setOuts]=useState(savedActive?savedActive.outs:0);const [batIdx,setBatIdx]=useState(savedActive?savedActive.batIdx:0);
  const [bases,setBases]=useState(savedActive?savedActive.bases:{first:null,second:null,third:null});const [lastO,setLastO]=useState(savedActive?savedActive.lastO:null);
  const [hist,setHist]=useState(savedActive&&savedActive.hist?savedActive.hist:[]);
  const [modal,setModal]=useState(null);const [games,setGames]=useState(()=>ldT("games",[]));
  const [picking,setPicking]=useState(false);const [ourS,setOurS]=useState(savedActive?savedActive.ourS:{});const [oppS,setOppS]=useState(savedActive?savedActive.oppS:{});
  const [oppAsk,setOppAsk]=useState(null);const [viewG,setViewG]=useState(null);const [editG,setEditG]=useState(null);
  const [roster,setRoster]=useState(()=>{
    // Check URL for shared roster first
    try{const params=new URLSearchParams(window.location.search);
      const r=params.get("roster");
      if(r){const decoded=JSON.parse(decodeURIComponent(r));
        if(Array.isArray(decoded)&&decoded.length>0){
          // Merge with existing roster (don't lose players)
          const existing=ldT("roster",[]);
          const merged=[...new Set([...existing,...decoded])];
          svT("roster",merged);
          // Also grab sheet link if included
          const sh=params.get("sheet");
          if(sh){svT("sheet_link",sh)}
          // Also grab sync URL if included
          const sy=params.get("sync");
          if(sy){svT("sync_url",sy)}
          // Clean URL without reloading
          window.history.replaceState({},"",window.location.pathname);
          return merged}}}catch(e){}
    return ldT("roster",[])});
  const [lineup,setLineup]=useState([]);
  const [opp,setOpp]=useState("");const [gNum,setGNum]=useState("");const [gDate,setGDate]=useState(new Date().toISOString().slice(0,10));
  const [field,setField]=useState("");const [isHome,setIsHome]=useState(true);const [newP,setNewP]=useState("");
  const [dragI,setDragI]=useState(null);const [rmConf,setRmConf]=useState(null);const [renameConf,setRenameConf]=useState(null);const [teamMenu,setTeamMenu]=useState(false);
  // Owner edit-lock: when a PIN is set and locked, rename/delete controls are hidden
  const [locked,setLocked]=useState(()=>{const p=ld("owner_pin","");return p?ld("edits_locked",true):false;});
  const [showLock,setShowLock]=useState(false);
  useEffect(()=>{sv("edits_locked",locked)},[locked]);
  // Rename a player everywhere locally — roster, lineup, and every past game's
  // lineup + plays (batter, who scored, fielder's-choice runner). Stats are
  // computed from these, so all history carries over under the new name.
  const renameLocal=(oldName,newName)=>{
    const mp=n=>n===oldName?newName:n;
    setRoster(p=>p.map(mp));
    setLineup(p=>p.map(mp));
    setGames(prev=>prev.map(g=>({...g,

  const [skipConf,setSkipConf]=useState(null);const [waitOpp,setWaitOpp]=useState(savedActive?!!savedActive.waitOpp:false);
  const [showPbP,setShowPbP]=useState(true);
  const [endConfirm,setEndConfirm]=useState(false);
  const [addLate,setAddLate]=useState(false);const [lateP,setLateP]=useState("");
  const [awardDate,setAwardDate]=useState(null);
  const [showShare,setShowShare]=useState(false);
  const [copied,setCopied]=useState(false);
  const [sheetLink,setSheetLink]=useState(()=>ldT("sheet_link",""));

  const shareUrl=()=>{const base=window.location.origin+window.location.pathname;
    let u=base+"?roster="+encodeURIComponent(JSON.stringify(roster))+"&team="+encodeURIComponent(TEAM);

  const statsShareUrl=()=>window.location.origin+window.location.pathname+"?view=stats&team="+encodeURIComponent(TEAM)+"&awards="+(ld("awards_on",true)?"1":"0")+"&sync="+encodeURIComponent(ldT("sync_url",""));

    setCopied(true);setTimeout(()=>setCopied(false),2000)})};

  useEffect(()=>{svT("games",games)},[games]);
  useEffect(()=>{svT("roster",roster)},[roster]);
  // ── Cloud roster sync ──
  // The Google Sheet is the source of truth. Pull it on load (so a scorer you
  // send the link to already has everyone), and push on every add/delete.
  const rosterReady=useRef(false);
  const lastRosterSynced=useRef(null);
  const pushRoster=(list)=>{
    const syncUrl=ldT("sync_url","");
    if(!syncUrl)return;
    const j=JSON.stringify(list);
    if(lastRosterSynced.current===j)return; // nothing changed
    lastRosterSynced.current=j;
    fetch(syncUrl,{method:"POST",headers:{"Content-Type":"text/plain"},
      body:JSON.stringify({action:"save_roster",roster:list})}).catch(()=>{});
  };
  useEffect(()=>{
    const syncUrl=ldT("sync_url","");
    if(!syncUrl){rosterReady.current=true;return;}
    fetch(syncUrl+"?action=roster").then(r=>r.json()).then(d=>{
      if(d&&d.status==="ok"){
        if(d.rosterInitialized){

        }

    }).catch(()=>{}).finally(()=>{rosterReady.current=true});
  },[]);
  useEffect(()=>{
    if(!rosterReady.current)return; // don't echo the initial cloud pull back up
    pushRoster(roster);
  },[roster]);
  // ── Manual game upload (no automatic syncing) ──
  // A game only goes to Google Sheets when you choose "upload" at save time,
  // or when you hit Sync on the Sync page. Nothing uploads on its own.
  const uploadGame=async(rec)=>{
    const url=ldT("sync_url","");if(!url)return false;
    try{
      const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"sync_all",games:[rec]})});
      const d=await r.json();
      if(d.status==="ok"){setGames(p=>p.map(g=>g.id===rec.id?{...g,synced:true}:g));return true}
    }catch(e){/* offline / backend down — left unsynced, upload later from Sync page */}

  };
  useEffect(()=>{if(sheetLink)svT("sheet_link",sheetLink)},[sheetLink]);
  // Continuously snapshot an in-progress game so an idle reload/crash can resume it
  useEffect(()=>{
    if((scr==="scoring"||scr==="summary")&&gd){
      svT("active_game",{scr,gd,plays,inn,outs,batIdx,bases,lastO,ourS,oppS,waitOpp,hist});
    }
  },[scr,gd,plays,inn,outs,batIdx,bases,lastO,ourS,oppS,waitOpp,hist]);
  const clearActive=()=>{try{localStorage.removeItem("md_"+tkey("active_game"))}catch(e){}};

  const _lu=(gd&&gd.lineup)?gd.lineup:[];
  const curBat=_lu.length?(_lu[batIdx%_lu.length]||""):"";

  const doPlay=(rbi,batScored,scored,fcInfo,adv,extraOuts)=>{
    setHist(h=>[...h,{plays,inn,outs,batIdx,bases,lastO,ourS,oppS,waitOpp}]);
    const{batter,outcome}=modal;const nb={first:null,second:null,third:null};
    const isHR=outcome==="HR";
    if(adv&&!isHR){Object.entries(adv).forEach(([name,dest])=>{
      if(dest==="1st")nb.first=name;else if(dest==="2nd")nb.second=name;else if(dest==="3rd")nb.third=name;
      else if(dest==="stay"){if(bases.first===name)nb.first=name;if(bases.second===name)nb.second=name;if(bases.third===name)nb.third=name}
    })}
    if(isHR){nb.first=null;nb.second=null;nb.third=null}
    else if(["1B","BB","FC"].includes(outcome)){if(!nb.first)nb.first=batter;else if(!nb.second)nb.second=batter;else if(!nb.third)nb.third=batter}
    else if(outcome==="2B"){if(!nb.second)nb.second=batter;else if(!nb.third)nb.third=batter}
    else if(outcome==="3B"){nb.third=batter}
    else if(OUTS.includes(outcome)||outcome==="SF"){if(!adv||Object.keys(adv).length===0){nb.first=bases.first;nb.second=bases.second;nb.third=bases.third}}
